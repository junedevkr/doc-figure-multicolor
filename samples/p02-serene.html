ayout_warnings\" style=\"display:none\"><\/pre>\n<script type=\"text/jf-deferred\">\n// v2.1 — 스크립트 오류를 숨기지 않는다. 그림 안에 빨간 글로 찍고 배치 점검이 원인을 보이며 실패하게 한다\n// (전에는 그림이 통째로 비고 --verify 는 '글자 누락'만 알렸다)\nwindow.addEventListener('error', function(e){\n  var m = 'board 오류: ' + (e.message || e) + (e.lineno ? ' (템플릿 줄 ' + e.lineno + ')' : '');\n  var p = document.getElementById('__layout_issues'), a = [];\n  try { a = JSON.parse(p.textContent || '[]'); } catch (_) {}\n  a.push(m); p.textContent = JSON.stringify(a);\n  var f = document.getElementById('figure');\n  if (f) { var d = document.createElement('div'); d.style.cssText = 'color:#C00;font:700 20px sans-serif;padding:12px'; d.textContent = '[' + m + ']'; f.appendChild(d); }\n  window.__RENDER_DONE__ = true;\n});\n<\/script>\n<script type=\"text/jf-deferred\">\nvar FIGURE={\"template\": \"board\", \"preset\": \"jf-serene\", \"header\": \"headline\", \"title\": \"4 분석 결과 > 4-1 집단별 변화\", \"tag\": \"더미 데이터 · 실제 결과 아님\", \"footer\": \"더미 데이터 예시 — 실제 논문 아님\", \"body\": [{\"row\": [{\"head\": \"문서 작성 시간\", \"tone\": \"main\", \"fill\": \"tint\", \"align\": \"center\", \"kpi\": {\"from\": \"52\", \"from_at\": \"도입 전\", \"to\": \"31\", \"to_at\": \"도입 후\", \"unit\": \"분\"}, \"sub\": \"건당 평균, −40.4%\"}, {\"head\": \"민원 1차 응답\", \"tone\": \"sub\", \"fill\": \"tint\", \"align\": \"center\", \"kpi\": {\"from\": \"3.8\", \"from_at\": \"도입 전\", \"to\": \"1.6\", \"to_at\": \"도입 후\", \"unit\": \"일\"}, \"sub\": \"평균 소요일, −57.9%\"}, {\"head\": \"재작업 비율\", \"tone\": \"stop\", \"fill\": \"tint\", \"align\": \"center\", \"kpi\": {\"from\": \"6.1\", \"from_at\": \"도입 전\", \"to\": \"8.4\", \"to_at\": \"도입 후\", \"unit\": \"%\"}, \"sub\": \"검수 미흡 부서에서 증가\"}], \"gap\": 22}, {\"row\": [{\"group\": \"부서 유형별 효과 크기\", \"tone\": \"main\", \"body\": [{\"matrix\": {\"cols\": [\"시간\", \"품질\", \"신뢰\"], \"rows\": [\"민원\", \"인허가\", \"기획\", \"복지\"], \"cells\": [[\"큼\", \"보통\", \"큼\"], [\"보통\", \"작음\", \"보통\"], [\"큼\", \"큼\", \"보통\"], [\"작음\", \"보통\", \"큼\"]]}}], \"w\": 1.1}, {\"col\": [{\"title\": \"효과가 큰 조건\", \"items\": [\"정형 문서 비중 60% 이상\", \"검수 기준 문서화\"], \"tone\": \"go\", \"fill\": \"tint\"}, {\"title\": \"효과가 약한 조건\", \"items\": [\"개인정보 처리 비중 높음\", \"전담 인력 없음\"], \"tone\": \"wait\", \"fill\": \"tint\"}], \"gap\": 14, \"w\": 1}], \"gap\": 22}], \"font\": \"pretendard\", \"page\": \"16:9\", \"width\": 1792, \"print_cm\": 26};if(window.__JF_OVERRIDE__&&FIGURE)Object.assign(FIGURE,window.__JF_OVERRIDE__); var ICONS={}; var ICON_SET={};\n(function(){\n  const F = FIGURE || {}, root = document.getElementById('figure');\n  const SVGNS = 'http://www.w3.org/2000/svg';\n  const TONE = {main:'main', navy:'main', sub:'sub', blue:'sub', go:'go', teal:'go', green:'go', wait:'wait', amber:'wait', orange:'wait',\n                stop:'stop', red:'stop', mute:'mute', gray:'mute', grey:'mute'};\n  const issues = [];\n  const ids = {};\n  if (F.width) root.style.width = F.width + 'px';\n  // 글자 크기는 인쇄 pt로 정한다 — 그림을 print_cm 폭(기본 16cm, A4 세로 본문)으로 넣을 때\n  // 본문 글자(목록·설명)가 body_pt(기본 10pt)가 되도록. B 는 본문의 1/0.9 배(제목·머리 기준).\n  // v2.1 — 기본 9pt. 사용자 채택본 board형 9장이 16~17cm 삽입에서 본문 중앙 9.1pt(7.8~9.4)였다.\n  //        10pt는 채택본보다 한 단계 커서 좁은 칸에서 서너 줄씩 꺾였다(2026-11-12 \"논리 흐름도가 구려졌다\").\n  const PRINT_CM = F.print_cm || 16, BODY_PT = F.body_pt || 9;\n  const PX_PER_PT = (F.width || 1500) / (PRINT_CM / 2.54 * 72);\n  root.style.setProperty('--B', (BODY_PT / 0.9 * PX_PER_PT).toFixed(2) + 'px');\n  if (F.lane_r) root.style.paddingRight = (40 + F.lane_r) + 'px';\n  if (F.lane_l) root.style.paddingLeft = (40 + F.lane_l) + 'px';\n\n  function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }\n  function tone(e, t){ if(!t) return; const k=TONE[t]||t; e.style.setProperty('--tc','var(--tone-'+k+')'); e.style.setProperty('--tt','var(--tone-'+k+'-tint)'); e.style.setProperty('--tl','var(--tone-'+k+'-line)'); }\n  function icon(name, size){\n    const body = ICON_SET[name];\n    if(!body){ if(name) issues.push('아이콘 없음: '+name); return null; }\n    const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none');\n    s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round'); s.innerHTML=body;\n    if(size){ s.setAttribute('width',size); s.setAttribute('height',size); }\n    return s;\n  }\n  function reg(e, n){ if(n && n.id){ e.dataset.id=n.id; ids[n.id]=e; } if(n && n.w!=null){ e.style.flex = n.w==='auto' ? '0 0 auto' : (typeof n.w==='number' && n.w>20 ? '0 0 '+n.w+'px' : n.w+' 1 0'); } if(n && n.h){ e.style.minHeight=n.h+'px'; } if(n && n.focus) e.classList.add('focus'); if(n && n.indent){ e.style.marginLeft=n.indent+'px'; } if(n && n.indent_r){ e.style.marginRight=n.indent_r+'px'; } return e; }\n  function lines(v){ return Array.isArray(v) ? v : (v==null ? [] : [v]); }\n  function arrowSvg(dir){\n    const s=document.createElementNS(SVGNS,'svg'); const v = dir==='down';\n    s.setAttribute('width', v?24:30); s.setAttribute('height', v?26:24);\n    s.innerHTML = v ? '<path d=\"M12 1 V17\" stroke=\"currentColor\" stroke-width=\"3.2\"/><path d=\"M3 13 L12 25 L21 13 Z\" fill=\"currentColor\"/>'\n                    : '<path d=\"M1 12 H18\" stroke=\"currentColor\" stroke-width=\"3.2\"/><path d=\"M14 3 L29 12 L14 21 Z\" fill=\"currentColor\"/>';\n    return s;\n  }\n  function joiner(kind, dir){\n    const j=el('div','jn');\n    if(kind==='plus'){ j.classList.add('plus'); j.textContent='+'; }\n    else if(kind==='eq'){ j.classList.add('eq'); j.textContent='='; }\n    else if(kind==='chevron'){ const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('width',dir==='down'?28:20); s.setAttribute('height',dir==='down'?20:28);\n      s.innerHTML = dir==='down' ? '<path d=\"M3 4 L14 15 L25 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>'\n                                 : '<path d=\"M4 3 L15 14 L4 25\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>'; j.append(s); }\n    else j.append(arrowSvg(dir));\n    return j;\n  }\n\n  // ---------------- 부품 ----------------\n  function items(list, n){\n    const ul=el('ul','items'); const b=(n&&n.bullet)||'dot'; if(b!=='dot') ul.classList.add('b-'+b); if(n&&n.tight) ul.classList.add('tight');\n    lines(list).forEach(t=>{ const li=el('li'); if(b==='check'){ const ck=el('span','ck'); const ic=icon('check'); if(ic) ck.append(ic); li.append(ck); li.append(document.createTextNode(t)); } else li.textContent=t; ul.append(li); });\n    return ul;\n  }\n  function card(n){\n    const c=reg(el('div','card'), n); tone(c, n.tone);\n    const fill=n.fill||'white'; if(fill!=='white') c.classList.add('f-'+fill);\n    if(n.accent) c.classList.add('ac-'+n.accent);\n    if(n.align==='center') c.classList.add('center');\n    if(n.valign==='middle') c.classList.add('mid');\n    let body=c;\n    if(n.head){\n      c.classList.add('has-head');\n      const h=el('div','chd'); if(n.head_style==='soft') h.classList.add('soft');\n      if(n.num && n.num_style!=='inline'){ c.classList.add('tabbed'); const nc=el('div','numc',n.num); c.append(nc); }\n      if(n.num && n.num_style==='inline'){ h.append(el('span','num-in',n.num)); }\n      // v2.1 — head_sub 는 머리띠 아래 첫 줄(작은 회색 글)로. 머리띠를 한 줄로 얇게 두기 위해서다. 띠 안에 두려면 head_sub_in: true\n      h.append(document.createTextNode(n.head)); if(n.head_sub && n.head_sub_in) h.append(el('span','hs',n.head_sub));\n      c.append(h); body=el('div','body'); c.append(body);\n      if(n.head_sub && !n.head_sub_in) body.append(el('div','hsb',n.head_sub));\n      if(n.align==='center') body.style.alignItems='center';\n    }\n    const side = n.layout==='side';\n    let holder=body;\n    let titleDone=false;\n    if(n.icon){ const w=el('div','ic'); const ic=icon(n.icon); if(ic) w.append(ic);\n      if(side){ body.classList.add('side'); if(body===c) c.classList.add('side'); body.append(w); holder=el('div','txt'); body.append(holder); }\n      else if(n.align!=='center' && !n.head && n.title && n.layout!=='stack'){ const tr=el('div','trow'); tr.append(w); tr.append(el('div','ct',n.title)); body.append(tr); titleDone=true; }\n      else { w.style.alignSelf = n.align==='center' ? 'center' : 'flex-start'; body.append(w); } }\n    if(titleDone){}\n    else if(n.num && !n.head){ const t=el('div','ct'); t.append(el('span','num-in',n.num)); t.append(document.createTextNode(n.title||'')); t.querySelector('.num-in').style.cssText='background:var(--tc,var(--tone-main));color:#fff'; holder.append(t); }\n    else if(n.title) holder.append(el('div','ct',n.title));\n    if(n.kpi){ const k=n.kpi, row=el('div','kpi');\n      if(k.from!=null){ const f=el('span','from',String(k.from)); if(k.unit) f.append(el('small',null,k.unit)); if(k.from_at) f.append(el('span','at',k.from_at)); row.append(f); row.append(el('span','ar','➜')); }\n      const t=el('span','to',String(k.to)); if(k.unit) t.append(el('small',null,k.unit)); if(k.to_at) t.append(el('span','at',k.to_at)); row.append(t); holder.append(row); }\n    if(n.value!=null){ const v=el('div','cv',String(n.value)); if(n.unit){ v.append(el('small',null,n.unit)); } holder.append(v); }\n    if(n.sub) lines(n.sub).forEach(s=>holder.append(el('div','cs',s)));\n    if(n.pill){ const pi=el('div','pillin',n.pill); if(n.pill_tone){ const k=TONE[n.pill_tone]||n.pill_tone; pi.classList.add('toned'); pi.style.setProperty('--pt-ink','var(--tone-'+k+')'); pi.style.setProperty('--pt-tint','var(--tone-'+k+'-tint)'); pi.style.setProperty('--pt-line','var(--tone-'+k+'-line)'); } holder.append(pi); }\n    if(n.items) holder.append(items(n.items, n));\n    if(n.text) holder.append(el('div','tx',n.text));\n    // 카드 안 body 는 부품 하나 또는 부품 배열(위에서 아래로 쌓음). v2.1 전에는 배열이면 카드로 잘못 읽혀 그림 전체가 멈췄다\n    if(n.body) holder.append(Array.isArray(n.body) ? flex({col:n.body, gap: n.body_gap!=null ? n.body_gap : 8}, 'col') : build(n.body));\n    return c;\n  }\n  function band(n){\n    const b=reg(el('div','band'), n); tone(b, n.tone); if(n.style) b.classList.add(n.style); if(n.align==='left') b.classList.add('left');\n    if(n.label){ const l=el('div','bl'); if(n.label_style==='soft') l.classList.add('soft'); if(n.icon){ const ic=icon(n.icon); if(ic) l.append(ic); } l.append(document.createTextNode(n.label)); if(n.label_w) l.style.width=n.label_w+'px'; b.append(l); }\n    const t=el('div','bt'); if(n.band) t.append(el('div','m',n.band)); lines(n.sub).forEach(s=>t.append(el('div','s',s))); b.append(t);\n    if(n.body){ t.style.padding = n.pad!=null ? n.pad+'px' : '14px 16px'; }\n    if(n.body){ t.append(build(n.body)); }\n    return b;\n  }\n  function pill(n){ const p=reg(el('div','pill',n.pill), n); tone(p,n.tone); if(n.style) p.classList.add(n.style); if(n.inline) p.classList.add('inline'); if(n.shape==='square') p.classList.add('sq'); return p; }\n  function steps(n){\n    const s=reg(el('div','steps'), n); tone(s,n.tone); if(n.style) s.classList.add(n.style);\n    n.steps.forEach((st,i)=>{ const o=typeof st==='string'?{title:st}:st; const d=el('div','st'); if(o.id){ d.dataset.id=o.id; ids[o.id]=d; }\n      if(o.on || n.on===i) d.classList.add('on'); if(o.tone) tone(d,o.tone);\n      d.append(el('div','m',o.title)); lines(o.sub).forEach(x=>d.append(el('div','s',x))); s.append(d); });\n    return s;\n  }\n  function chips(n){\n    const c=reg(el('div','chips'), n); tone(c,n.tone); if(n.check) c.classList.add('check'); if(n.cols) c.classList.add('cols'+n.cols); if(n.fill) c.classList.add('fill'); if(n.shape==='square') c.classList.add('sq');\n    if(n.label){ const l=el('div','clabel',n.label); if(n.label_en) l.append(el('small',null,n.label_en)); c.append(l); }\n    n.chips.forEach(ch=>{ const o=typeof ch==='string'?{text:ch}:ch; const d=el('div','chip'); if(o.tone) tone(d,o.tone);\n      const ic = n.check ? icon('circle-check') : (o.icon ? icon(o.icon) : null); if(ic) d.append(ic);\n      d.append(document.createTextNode(o.text)); c.append(d); });\n    return c;\n  }\n  function diamond(n){\n    const w=n.size_w||210, h=n.size_h||170; const d=reg(el('div','diamond'), n); tone(d, n.tone||'go'); d.style.width=w+'px'; d.style.height=h+'px';\n    const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('class','dshape'); s.setAttribute('viewBox','0 0 '+w+' '+h); s.setAttribute('width',w); s.setAttribute('height',h);\n    s.innerHTML='<path d=\"M'+w/2+' 2 L'+(w-2)+' '+h/2+' L'+w/2+' '+(h-2)+' L2 '+h/2+' Z\"/>'; d.append(s); d.append(el('div','dt',n.diamond)); return d;\n  }\n  function tline(n){\n    const t=reg(el('div','tline'), n); const segs=n.timeline; const tot=segs.reduce((a,s)=>a+(s.w||1),0);\n    const L=el('div','tl-labels'), B=el('div','tl-bar'), M=el('div','tl-marks'); let acc=0; let hasMarks=false;\n    segs.forEach((sg,i)=>{ const pct=100*(sg.w||1)/tot; const k=TONE[sg.tone]||sg.tone||'main';\n      const lab=el('div'); lab.style.width=pct+'%'; lab.style.setProperty('--tc','var(--tone-'+k+')'); lab.append(document.createTextNode(sg.label||'')); if(sg.sub) lab.append(el('span','s',sg.sub)); L.append(lab);\n      const bar=el('div'); bar.style.width=pct+'%'; bar.style.setProperty('--tc','var(--tone-'+k+')'); B.append(bar);\n      const mk=el('div',null,sg.mark||''); mk.style.width=pct+'%'; if(sg.mark) hasMarks=true; M.append(mk);\n      acc+=pct; if(i<segs.length-1 && n.knots!==false){ const kn=el('div','knot'); kn.style.left=acc+'%'; B.append(kn); } });\n    const tip=el('div','tip'); const last=TONE[segs[segs.length-1].tone]||segs[segs.length-1].tone||'main'; t.style.setProperty('--tl-tip','var(--tone-'+last+')'); B.append(tip);\n    t.append(L,B); if(hasMarks) t.append(M); return t;\n  }\n  function matrix(n){\n    const m=n.matrix; const tb=reg(el('table','mtx'), n); tone(tb, n.tone||'wait');\n    const hr=el('tr'); hr.append(el('th')); m.cols.forEach(c=>hr.append(el('th',null,c))); tb.append(hr);\n    m.rows.forEach((r,i)=>{ const tr=e 병목·미통과 분기 */\n  --accent-soft: #F2E2E4;   /* 강조 배경 */\n  --track-1:     #A49393;   /* 타임라인 축1 진남색 */\n  --track-2:     #7E7777;   /* 타임라인 축2 청회색 */\n  --track-3:     #B7AEAE;   /* 타임라인 축3 옅은 회색 */\n  /* --- 보조 선·바탕 (템플릿 하드코딩 제거분) --- */\n  --neutral-head:#695959;\n  --line-soft:   #DAD7D7;\n  --fill-faint:  #F9F8F8;\n  --line-track:  #D0C8C8;\n\n\n  /* --- 타이포 --- */\n  --font: \"Presentation\", \"PresentationVariable\", \"Pretendard\", \"Apple SD Gothic Neo\", \"NanumSquare\", \"NanumGothic\", \"Malgun Gothic\", sans-serif;\n  --w-title: 800;\n  --w-strong: 700;\n  --w-label: 600;\n  --w-body: 500;\n\n  /* --- 형태 --- */\n  --radius-bar: 12px;\n  --radius-box: 18px;\n  --radius-badge: 30%;\n  --shadow: 0 0 0 transparent;\n\n  /* --- 형태 (v1.1 — 색이 아니라 '생김새'를 바꾸는 토큰) ---\n     기본값은 v1.0 모양과 같다. 값을 바꾸면 11종이 한꺼번에 다른 인상이 된다. */\n  --font-title:  \"Presentation\", \"PresentationVariable\", \"Pretendard\", \"Apple SD Gothic Neo\", \"NanumSquare\", \"NanumGothic\", \"Malgun Gothic\", sans-serif;   /* 제목 글꼴 — 본문(--font)과 따로 */\n  --title-align: left;       /* center | left */\n  --title-scale: 1.3;            /* 제목 크기 배율 */\n  --title-ink:   #2B2222;\n  --title-track: -1px;         /* 제목 자간 */\n  --title-deco:  none;        /* 제목 양옆 장식선: block | none */\n  --title-under: 0 solid transparent;   /* 제목 아래 가로줄 (border 값) */\n  --title-under-gap: 0px;\n  --caption-align: center;\n  --caption-ink: var(--ink);\n  --strong-fill: var(--navy-deep);      /* 강조 상자(헤더 띠·뿌리 상자·최종 단계) 채움 */\n  --strong-ink:  #2B2222;\n  --strong-ink-soft: #5E4F4F;\n  --strong-ring: inset 0 0 0 0 transparent;   /* 강조 상자 안쪽 테두리 — 외곽선형이면 inset 0 0 0 2px 색 */\n  --card-fill:   #FFFFFF;               /* 일반 카드 바탕 */\n  --badge-shape: 30%;                   /* 번호 뱃지·단계 원 — 50%=원, 4px=사각 */\n  --radius-pill: 18px;                 /* 알약형 칩 — 각지게 하려면 작은 값 */\n  --word-break: keep-all;                 /* keep-all = 한국어 낱말 단위 줄바꿈 */\n  --shadow-hub:  0 0 0 transparent;   /* 논증 도해 중심 상자 그림자 */\n\n  /* --- 편집 (v1.3 — 보고 link-w: 3px;\n  --board-band-label: rgba(0, 0, 0, 0.18);\n  --board-bar-sep: rgba(255, 255, 255, 0.35);\n  --board-step-mid: #D5D2D2;\n  /* --- /board --- */\n\n  /* --- viz (v2.2) — 그라데이션·입체 스위치. 0 = 평면(기본). design-report 프리셋만 켠다 --- */\n  --gloss: 0;                       /* 0~0.35 — 도형 위 밝은 그라데이션의 세기 */\n  --solid: 0;                       /* 1 = 깔때기 타원 테·둥근 막대 끝 같은 입체 표현 */\n}\n\n/* =========================================================================\n   board — 조립형 도식 엔진 (v2.0)\n   내용에 맞춰 배치를 새로 짠다. 같은 상자를 격자로 늘어놓지 않는다.\n   행(row)·열(col)·묶음(group) 안에 부품(카드·띠·알약·단계·칩·마름모·시간 띠·\n   미니 매트릭스·키-값·목록)을 넣고, id 로 화살표를 잇는다.\n   색은 '뜻'으로 고른다 — main(본체·진행) sub(보조) go(산출·통과·투입)\n   wait(주의·대기·예시) stop(탈락·제약) mute(기존·관찰·비교 기준).\n   ========================================================================= */\n* { margin:0; padding:0; box-sizing:border-box; }\nhtml,body { background:#fff; }\n:root { --B: var(--board-fs); }\n#figure { width:1500px; background:var(--bg); font-family:var(--board-font); color:var(--ink);\n  padding:34px 40px 28px; position:relative; word-break:keep-all; overflow-wrap:break-word;\n  -webkit-font-smoothing:antialiased; line-height:1.4; }\n#figure.fs-s { --B: calc(var(--board-fs) * 0.9); }\n#figure.fs-l { --B: calc(var(--board-fs) * 1.1); }\n\n/* ---- 머리 ---- */\n.hd { margin-bottom:24px; position:relative; }\n.hd.headline { padding-left:26px; border-bottom:2px solid var(--board-line); padding-bottom:18px; }\n.hd.headline::before { content:\"\"; position:absolute; left:0; top:4px; bottom:20px; width:9px; background:var(--tone-go); }\n.hd .kicker { font-size:calc(var(--B) * 0.95); font-weight:700; color:var(--tone-go); margin-bottom:4px; }\n.hd h1 { font-family:var(--board-font); font-size:calc(var(--B) * 1.35); font-weight:800; color:var(--tone-main); letter-spacing:-0.5px; line-height:1.25; }\n.hd .sub { margin-top:8px; font-size:calc(var(--B) * 0.9); font-weight:500; color:var(--ink-soft); }\n.hd .tag { position:absolute; right:0; top:0; background:var(--tone-wait-tint); color:var(--tone-wait); font-weight:700;\n  font-size:calc(var(--B) * 0.82); padding:6px 16px; border-radius:var(--board-radius); }\n.hd.plain h1 { font-size:calc(var(--B) * 1.3); }\n.hd.center { text-align:center; }\n.hd.center h1 { font-size:calc(var(--B) * 1.25); }\n.hd.bar { background:var(--tone-main-tint); border-radius:var(--board-radius); overflow:hidden; padding:0 0 12px; border:1.5px solid var(--tone-main-line); }\n.hd.bar.nosub { padding-bottom:0; }\n.hd.bar .barrow { display:flex; align-items:stretch; background:var(--tone-main); color:#fff; }\n.hd.bar .num { padding:12px 22px; font-weight:800; font-size:calc(var(--B) * 1.2); border-right:1.5px solid var(--board-bar-sep); white-space:nowrap; }\n.hd.bar h1 { color:#fff; padding:12px 24px; font-size:calc(var(--B) * 1.2); }\n.hd.bar .sub { padding:0 24px; margin-top:10px; color:var(--tone-main); font-weight:600; }\n.hd.bar .tag { top:auto; bottom:8px; right:12px; }\n.caption-top { text-align:center; font-size:calc(var(--B) * 1.05); font-weight:700; margin-bottom:16px; }\n\n/* ---- 배치 ---- */\n.row { display:flex; align-items:stretch; gap:var(--gap, 18px); }\n.col { display:flex; flex-direction:column; gap:var(--gap, 14px); }\n.row > *, .col > * { min-width:0; }\n.row > .grow { flex:1 1 0; }\n.row.a-center { align-items:center; } .row.a-start { align-items:flex-start; } .row.a-end { align-items:flex-end; }\n.col.j-center { justify-content:center; } .col.j-between { justify-content:space-between; }\n.jn { flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:var(--tone-sub); }\n.row > .jn { width:30px; margin:0 -6px; } .col > .jn { height:26px; margin:-5px 0; }\n.jn svg { display:block; }\n.jn.plus, .jn.eq { font-size:calc(var(--B) * 1.5); font-weight:800; color:var(--tone-main); }\n\n/* ---- 묶음 ---- */\n.group { border:2px solid var(--tc, var(--tone-main)); border-radius:calc(var(--board-radius) + 4px); background:var(--board-panel); display:flex; flex-direction:column; overflow:hidden; }\n.group > .gh { background:var(--tc, var(--tone-main)); color:#fff; font-weight:800; text-align:center; font-size:calc(var(--B) * 1.0); padding:9px 14px; }\n.group > .gh.left { text-align:left; }\n.group > .gh .gs { font-weight:500; opacity:.85; margin-left:12px; font-size:calc(var(--B) * 0.82); }\n.group > .gb { padding:16px; flex:1; display:flex; flex-direction:column; gap:14px; }\n.group.soft { border-width:1.5px; border-color:var(--tl, var(--tone-main-line)); }\n.group.soft > .gh { background:var(--tt, var(--tone-main-tint)); color:var(--tc, var(--tone-main)); }\n.group.bare { border:none; background:none; } .group.bare > .gb { padding:0; }\n.group.dash { border-style:dashed; }\n\n/* ---- 카드 ---- */\n.card { position:relative; background:var(--card-bg, #fff); border:1.5px solid var(--tl, var(--board-line)); border-radius:var(--board-radius);\n  padding:14px 18px; display:flex; flex-direction:column; gap:7px; }\n.card.center { align-items:center; text-align:center; }\n.card.mid { justify-content:center; }\n.card.f-tint { --card-bg: var(--tt, var(--tone-main-tint)); }\n.card.f-panel { --card-bg: var(--board-panel); }\n.card.f-solid { --card-bg: var(--tc, var(--tone-main)); border-color:var(--tc, var(--tone-main)); color:#fff; }\n.card.f-solid .ct, .card.f-solid .cs, .card.f-solid li { color:#fff; }\n.card.f-solid li::before { background:#fff; }\n.card.f-dash { --card-bg: var(--tt, var(--tone-stop-tint)); border-style:dashed; border-color:var(--tc, var(--tone-stop)); }\n.card.f-dash .ct { color:var(--tc, var(--tone-stop)); }\n.card.ac-left { padding-left:26px; } .card.ac-left::before { content:\"\"; position:absolute; left:-1.5px; top:-1.5px; bottom:-1.5px; width:8px; background:var(--tc, var(--tone-main)); border-radius:var(--board-radius) 0 0 var(--board-radius); }\n.card.ac-top { border-top:6px solid var(--tc, var(--tone-main)); }\n.card.has-head { padding:0; overflow:hidden; }\n.card.has-head > .chd { align-self:stretch; }\n.card.has-head > .body { padding:12px 16px 14px; display:flex; flex-direction:column; gap:7px; flex:1; }\n.card.has-head.center > .body { align-items:center; }\n.card .chd { background:var(--tc, var(--tone-main)); color:#fff; font-weight:800; font-size:calc(var(--B) * 0.98); padding:5px 12px; text-align:center; position:relative; line-height:1.3; } /* v2.1 얇은 머리띠 (위아래 10px → 5px) */\n.card .chd.soft { background:var(--tt, var(--tone-main-tint)); color:var(--tc, var(--tone-main)); }\n.card .chd .hs { display:block; font-weight:500; font-size:calc(var(--B) * 0.74); opacity:.85; margin-top:1px; }\n.card .hsb { font-size:calc(var(--B) * 0.8); font-weight:600; color:var(--tc, var(--tone-main)); opacity:.85; line-height:1.3; }\n.card.has-head.center .hsb { text-align:center; }\n.card.tabbed { margin-top:calc(var(--B) * 0.45); overflow:visible; } .card.tabbed .chd { padding-left:calc(var(--B) * 1.75); text-align:left; border-radius:var(--board-radius) var(--board-radius) 0 0; }\n.card .numc { position:absolute; z-index:2; left:8px; top:calc(var(--B) * -0.42); width:calc(var(--B) * 1.3); height:calc(var(--B) * 1.3); border-radius:50%; background:var(--tone-main); color:#fff; border:2px solid #fff;\n  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:calc(var(--B) * 0.8); box-shadow:0 0 0 1.5px var(--tc, var(--tone-main)); }\n.card .num-in { display:inline-flex; align-items:center; justify-content:center; min-width:1.7em; height:1.7em; border-radius:50%; background:#fff; color:var(--tc, var(--tone-main));\n  font-weight:800; margin-right:8px; font-size:.82em; vertical-align:1px; padding:0 4px; }\n.card .ct { font-weight:800; font-size:calc(var(--B) * 1.04); color:var(--tc, var(--tone-main)); line-height:1.3; }\n.card .cs { font-size:calc(var(--B) * 0.86); color:var(--ink-soft); font-weight:500; line-height:1.35; }\n.card .cv { font-size:calc(var(--B) * 1.7); font-weight:800; color:var(--tc, var(--tone-main)); line-height:1.1; }\n.card .cv sm rtant; }\n  #jf-fit { width: auto !important; height: auto !important; }\n  #jf-fit > #jf-page { position: relative; }\n  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n}\n<\/style>\n<\/head>\n<body>\n<div id=\"figure\"><\/div>\n<pre id=\"__layout_issues\" style=\"display:none\"><\/pre>\n<pre id=\"__layout_warnings\" style=\"display:none\"><\/pre>\n<script type=\"text/jf-deferred\">\n// v2.1 — 스크립트 오류를 숨기지 않는다. 그림 안에 빨간 글로 찍고 배치 점검이 원인을 보이며 실패하게 한다\n// (전에는 그림이 통째로 비고 --verify 는 '글자 누락'만 알렸다)\nwindow.addEventListener('error', function(e){\n  var m = 'board 오류: ' + (e.message || e) + (e.lineno ? ' (템플릿 줄 ' + e.lineno + ')' : '');\n  var p = document.getElementById('__layout_issues'), a = [];\n  try { a = JSON.parse(p.textContent || '[]'); } catch (_) {}\n  a.push(m); p.textContent = JSON.stringify(a);\n  var f = document.getElementById('figure');\n  if (f) { var d = document.createElement('div'); d.style.cssText = 'color:#C00;font:700 20px sans-serif;padding:12px'; d.textContent = '[' + m + ']'; f.appendChild(d); }\n  window.__RENDER_DONE__ = true;\n});\n<\/script>\n<script type=\"text/jf-deferred\">\nvar FIGURE={\"template\": \"board\", \"preset\": \"jf-serene\", \"header\": \"headline\", \"title\": \"4 분석 결과 > 4-2 판단 경로\", \"tag\": \"더미 데이터 · 실제 결과 아님\", \"footer\": \"더미 데이터 예시 — 실제 논문 아님\", \"body\": [{\"row\": [{\"id\": \"req\", \"title\": \"업무 요청 접수\", \"sub\": \"민원 · 내부 문서\", \"icon\": \"message-circle\", \"fill\": \"tint\", \"align\": \"center\", \"w\": 1}, {\"id\": \"dec\", \"diamond\": \"개인정보\\n포함?\", \"size_w\": 300, \"size_h\": 230, \"tone\": \"wait\"}, {\"col\": [{\"id\": \"ai\", \"title\": \"AI 초안 작성\", \"sub\": \"표준 서식 · 근거 조항 첨부\", \"fill\": \"tint\", \"tone\": \"main\", \"head\": \"아니오\"}, {\"id\": \"manual\", \"title\": \"담당자 직접 작성\", \"sub\": \"AI 사용 제한\", \"fill\": \"tint\", \"tone\": \"mute\", \"head\": \"예\"}], \"gap\": 40, \"w\": 1.1}, {\"id\": \"review\", \"title\": \"검수 · 승인\", \"sub\": \"체크리스트 12항목\", \"icon\": \"clipboa t issues = [];\n  const ids = {};\n  if (F.width) root.style.width = F.width + 'px';\n  // 글자 크기는 인쇄 pt로 정한다 — 그림을 print_cm 폭(기본 16cm, A4 세로 본문)으로 넣을 때\n  // 본문 글자(목록·설명)가 body_pt(기본 10pt)가 되도록. B 는 본문의 1/0.9 배(제목·머리 기준).\n  // v2.1 — 기본 9pt. 사용자 채택본 board형 9장이 16~17cm 삽입에서 본문 중앙 9.1pt(7.8~9.4)였다.\n  //        10pt는 채택본보다 한 단계 커서 좁은 칸에서 서너 줄씩 꺾였다(2026-11-12 \"논리 흐름도가 구려졌다\").\n  const PRINT_CM = F.print_cm || 16, BODY_PT = F.body_pt || 9;\n  const PX_PER_PT = (F.width || 1500) / (PRINT_CM / 2.54 * 72);\n  root.style.setProperty('--B', (BODY_PT / 0.9 * PX_PER_PT).toFixed(2) + 'px');\n  if (F.lane_r) root.style.paddingRight = (40 + F.lane_r) + 'px';\n  if (F.lane_l) root.style.paddingLeft = (40 + F.lane_l) + 'px';\n\n  function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }\n  function tone(e, t){ if(!t) return; const k=TONE[t]||t; e.style.setProperty('--tc','var(--tone-'+k+')'); e.style.setProperty('--tt','var(--tone-'+k+'-tint)'); e.style.setProperty('--tl','var(--tone-'+k+'-line)'); }\n  function icon(name, size){\n    const body = ICON_SET[name];\n    if(!body){ if(name) issues.push('아이콘 없음: '+name); return null; }\n    const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none');\n    s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round'); s.innerHTML=body;\n    if(size){ s.setAttribute('width',size); s.setAttribute('height',size); }\n    return s;\n  }\n  function reg(e, n){ if(n && n.id){ e.dataset.id=n.id; ids[n.id]=e; } if(n && n.w!=null){ e.style.flex = n.w==='auto' ? '0 0 auto' : (typeof n.w==='number' && n.w>20 ? '0 0 '+n.w+'px' : n.w+' 1 0'); } if(n && n.h){ e.style.minHeight=n.h+'px'; } if(n && n.focus) e.classList.add('focus'); if(n && n.indent){ e.style.marginLeft=n.indent+'px'; } if(n && n.indent_r){ e.style.marginRight=n.indent_r+'px'; } return e; }\n  function lines(v){ return Array.isArra =================================================================== */\n:root {\n  /* v2.0.1 인쇄 크기 — 16cm 폭에 넣을 때 본문 약 10pt·최소 8pt 이상 (text-scale·caption-size·src-size·title-scale·word-break) */\n  /* --- 팔레트 --- */\n  --navy-deep:   #A49393;   /* 뱃지·헤더밴드·푸터칩·누적박스 */\n  --navy-mid:    #E8B4B8;   /* 보조 강조 */\n  --navy-marker: #B98A90;   /* 게이트 ▼ · 마일스톤 ◆ */\n  --bar-fill:    #F3F2F2;   /* 간트바 채움 (연) */\n  --bar-fill-2:  #E7E4E4;   /* 간트바 채움 (진) */\n  --bar-border:  #E8B4B8;   /* 간트바 테두리 */\n  --grid-line:   #E2DADA;   /* 월 구분 점선·격자 */\n  --ink:         #2B2222;   /* 본문 텍스트 */\n  --ink-soft:    #5E4F4F;   /* 부제·캡션 */\n  --bg:          #FFFFFF;   /* 배경 (항상 흰색) */\n  --chip-track:  #E7E4E4;   /* 도넛 트랙 */\n\n  /* --- 확장 토큰 (추가만 — 기존 값 불변) --- */\n  --heat-1:      #F6E1E3;   /* 판정 히트맵 1단계(약) */\n  --heat-2:      #E8B4B8;   /* 판정 히트맵 2단계(중) */\n  --heat-3:      #A49393;   /* 판정 히트맵 3단계(강) */\n  --heat-1-ink:  #2B2222;\n  --heat-2-ink:  #2B2222;\n  --heat-3-ink:  #2B2222;\n  --neutral-fill:#F4F3F3;   /* 기준(무채색) 열·보조 바탕 */\n  --neutral-line:#CEC5C5;   /* 무채색 테두리 */\n  --neutral-ink: #5E5050;   /* 무채색 본문 */\n  --accent:      #B98A90;   /* 강조색 — 병목·미통과 분기 */\n  --accent-soft: #F2E2E4;   /* 강조 배경 */\n  --track-1:     #A49393;   /* 타임라인 축1 진남색 */\n  --track-2:     #7E7777;   /* 타임라인 축2 청회색 */\n  --track-3:     #B7AEAE;   /* 타임라인 축3 옅은 회색 */\n  /* --- 보조 선·바탕 (템플릿 하드코딩 제거분) --- */\n  --neutral-head:#695959;\n  --line-soft:   #DAD7D7;\n  --fill-faint:  #F9F8F8;\n  --line-track:  #D0C8C8;\n\n\n  /* --- 타이포 --- */\n  --font: \"Presentation\", \"PresentationVariable\", \"Pretendard\", \"Apple SD Gothic Neo\", \"NanumSquare\", \"NanumGothic\", \"Malgun Gothic\", sans-serif;\n  --w-title: 800;\n  --w-strong: 700;\n  --w-label: 600;\n  --w-body: 500;\n\n  /* --- 형태 --- */\n  --radius-bar: 12px;\n  --radius-box: 18px;\n  --radius-badge: 30%;\n  --shadow: 0 0 0 transparent;\n\n  /* --- 형태 (v1.1 — 색이 아니라 '생김새'를 바꾸는 토큰) ---\n     기본값은 v1.0 모양과 같다. 값을 바꾸면 11종이 한꺼번에 다른 인상이 된다. */\n  --font-ti  · venn 교집합 · quadrant 2×2 포지셔닝 · pyramid 위계\n     concentric 동심원 · hub 허브 · fishbone 원인 · staircase 계단 · before-after 전후\n     waterfall 증감 · iceberg 드러난/숨은 · swimlane 주체별 흐름 · logic-tree 이슈 트리\n\n   도형은 SVG, 글자는 절대배치 HTML — 한국어 줄바꿈을 브라우저가 맡는다.\n   색은 전부 토큰. 밑줄 키(_x·_y·_lane·_col·_focus …)는 배치 지시라 글자가 아니다.\n   ========================================================================= */\n* { margin:0; padding:0; box-sizing:border-box; }\nhtml,body { background:#fff; }\n#figure { width:1500px; word-break:keep-all; display:var(--fig-display); flex-direction:column; background:var(--bg); font-family:var(--font); color:var(--ink);\n  padding:34px 44px 30px; -webkit-font-smoothing:antialiased; }\n.hd { text-align:var(--title-align); border-bottom:var(--title-under); padding-bottom:var(--title-under-gap); margin-bottom:26px; }\n.hd .title-row { display:flex; align-items:center; justify-content:var(--title-align); gap:20px; }\n.hd .rule { display:var(--title-deco); flex:1; height:3px; background:var(--navy-deep); position:relative; max-width:340px; }\n.hd .rule::before,.hd .rule::after{content:\"\";position:absolute;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;background:var(--navy-deep);}\n.hd .rule.l::before{left:-2px;} .hd .rule.r::after{right:-2px;}\n.hd h1 { font-size:calc(38px * var(--title-scale)); font-family:var(--font-title); font-weight:var(--w-title); color:var(--title-ink); letter-spacing:var(--title-track); white-space:nowrap; }\n.hd .sub { margin-top:12px; font-size:calc(20px * var(--fts)); font-weight:var(--w-label); color:var(--ink-soft); }\n.caption { order:var(--caption-order); text-align:var(--caption-align); margin-top:calc(24px * var(--caption-mt)); margin-bottom:var(--caption-mb); font-size:var(--caption-size); font-weight:var(--caption-weight); color:var(--caption-ink); }\n.src { order:20; text-align:left; margin-top:var(--src-gap); font-size:var(--src-size); font-weight:var(--w-body); color:var(--ink-soft); line-heigh t; }\nhtml.jf-pop #figure::before { background: var(--tone-sub) !important; }\n\n/* ===== 짙은 바탕 컨셉(jf-deep): 주색을 바깥 배경으로, 표식은 강조색 ===== */\nhtml.jf-page.jf-deep, html.jf-page.jf-deep body { background: var(--tone-main) !important; }\nhtml.jf-page.jf-deep.jf-embed, html.jf-page.jf-deep.jf-embed body { background: var(--bg, #fff) !important; }\nhtml.jf-deep #jf-page { box-shadow: 0 18px 50px rgba(0,0,0,.35); }\nhtml.jf-deep #figure .hd.headline::before, html.jf-deep #figure::before { background: var(--tone-wait) !important; }\nhtml.jf-deep #figure .card .ct, html.jf-deep #figure .group > .gh { color: var(--ink) !important; }\n\n/* ===== 파스텔 출처 팔레트(jf-soft): 원본 색 면 위 글자를 짙은 색으로, 화살표는 짙은 회갈색 ===== */\nhtml.jf-page.jf-soft, html.jf-page.jf-soft body { background: var(--tone-main-tint) !important; }\nhtml.jf-page.jf-soft.jf-embed, html.jf-page.jf-soft.jf-embed body { background: var(--bg, #fff) !important; }\nhtml.jf-soft #jf-page { box-shadow: 0 14px 40px rgba(60,30,30,.14); }\nhtml.jf-soft #figure .hd.headline::before, html.jf-soft #figure::before { background: var(--tone-sub) !important; }\nhtml.jf-soft #figure .group > .gh, html.jf-soft #figure .card .chd, html.jf-soft #figure .band, html.jf-soft #figure .band .bl,\nhtml.jf-soft #figure .band .bt .s, html.jf-soft #figure .pill, html.jf-soft #figure .steps .st, html.jf-soft #figure .steps .st .s,\nhtml.jf-soft #figure .chips .clabel, html.jf-soft #figure .card.f-solid, html.jf-soft #figure .card.f-solid .ct,\nhtml.jf-soft #figure .card.f-solid .cs, html.jf-soft #figure .card.f-solid li, html.jf-soft #figure .card .ct,\nhtml.jf-soft #figure .card .cv, html.jf-soft #figure .card .kpi .to, html.jf-soft #figure .card .kpi .ar,\nhtml.jf-soft #figure .tline .tl-labels > div, html.jf-soft #figure .diamond .dt, html.jf-soft #figure .card .numc,\nhtml.jf-soft #figure .card .num-in, html.jf-soft #figure ul.items.b-num li::before { color: var(--ink) !important; opacity: 1 !important; }\nhtml.jf-soft #figure .card.f-solid .kpi .from, html.jf-soft #figure .card.f-solid .kpi .at { color: var(--ink-soft) !important; opacity: 1 !important; }\nhtml.jf-soft #figure .band .bl { background: rgba(255,255,255,.42) !important; }\nhtml.jf-soft #figure .card.f-solid li::before, html.jf-soft #figure ul.items li::before { background: var(--ink-soft) !important; }\nhtml.jf-soft #figure .card .ic svg, html.jf-soft #figure .chips .chip svg, html.jf-soft #figure .band .bl svg { stroke: var(--ink-soft) !important; }\nhtml.jf-soft #figure .card.f-solid .ic { background: rgba(255,255,255,.5); }\nhtml.jf-soft #figure .diamond svg.dshape path { stroke: var(--ink-soft) !important; }\nhtml.jf-soft #figure svg#links .lk { stroke: var(--ink-soft) !important; }\nhtml.jf-soft #figure svg#links marker path, html.jf-soft #figure svg#links marker polygon { fill: var(--ink-soft) !important; }\nhtml.jf-soft #figure .tline .tl-bar .knot { border-color: var(--ink-soft) !important; }\n\n@page { size: 1920px 1080px; margin: 0; }\n@media print {\n  html.jf-page, html.jf-page body { background: var(--bg, #fff) !important; }\n  html.jf-page body { padding: 0; }\n  #jf-page { box-shadow: none; transform: none !important; }\n  #jf-fit { width: auto !important; height: auto !important; }\n  #jf-fit > #jf-page { position: relative; }\n  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n}\n<\/style>\n<\/head>\n<body>\n<div id=\"figure\"><\/div>\n<script type=\"text/jf-deferred\">\nconst FIGURE = {\"template\": \"forms\", \"preset\": \"jf-serene\", \"title\": \"4 분석 결과 > 4-3 개선 과제 우선순위\", \"tag\": \"더미 데이터 · 실제 결과 아님\", \"footer\": \"더미 데이터 예시 — 실제 논문 아님\", \"data\": {\"x\": {\"label\": \"도입 난이도\", \"low\": \"쉬움\", \"high\": \"어려움\"}, \"y\": {\"label\": \"기대 효과\", \"low\": \"낮음\", \"high\": \"높음\"}, \"quadrants\": [{\"title\": \"즉시 추진\", \"desc\": \"효과 크고 쉬움\"}, {\"title\": \"중장기 과제\", \"desc\": \"효과 크나 어려움\"}, {\"title\": \"보완 과제\", \"desc\": \"쉽지만 효과 작음\"}, {\"title\": \"보류\", \"desc\": \"어렵고 효과 작음\"}], \"_focus\": \"TL\", \"items\": [{\"label\": \"검수 체크리스트\", \"_x\": 0.16, \"_y\": 0.82, \"highlight\": true}, {\"label\": \"서식 표준화\", \"_x\": 0.28, \"_y\": 0.66}, {\"label\": \"전담 인력 배치\", \"_x\": 0.7, \"_y\": 0.8}, {\"label\": \"내부 전용 모델\", \"_x\": 0.86, \"_y\": 0.62}, {\"label\": \"사용 안내 영상\", \"_x\": 0.22, \"_y\": 0.26}, {\"label\": \"전면 자동 발송\", \"_x\": 0.84, \"_y\": 0.22}]}, \"form\": \"quadrant\", \"font\": \"pretendard\", \"page\": \"16:9\"};\nvar ICONS= {};\n(function(){\n  const F=FIGURE, root=document.getElementById('figure'), W=1412, NS=\"http://www.w3.org/2000/svg\";\n  const D=F.data||F;               // 데이터는 \"data\" 아래에 두거나 최상위에 둔다\n  const form=F.form||F.template; root.classList.add('f-'+form);\n  if(F.title){ const hd=div('hd'),tr=div('title-row'); tr.append(div('rule l'),t('h1',null,F.title),div('rule r')); hd.append(tr);\n    if(F.subtitle) hd.append(t('div','sub',F.subtitle)); root.append(hd); }\n  const after=[];\n  const R = {cycle, funnel, venn, quadrant, pyramid, concentric, hub, fishbone, staircase,\n             'before-after':beforeAfter, waterfall, iceberg, swimlane, 'logic-tree':logicTree};\n  if(!R[form]) { root.append(t('div','caption','[forms] 알 수 없는 form: '+form)); return; }\n  try { R[form](D); } catch(e) { root.append(t('div','caption','[forms 오류] '+form+': '+e.message)); console.error(e); }\n  if(F.caption) root.append(t('div','caption',F.caption));\n  if(F.unit) root.append(t('div','unit',/^\\(/.test(F.unit)?F.unit:'(단위: '+F.unit+')'));\n  if(F.footnote) root.append(t('div','src',/^(주|※|Note)/.test(F.footnote)?F.footnote:'주: '+F.footnote));\n  if(F.source) root.append(t('div','src',/^(자료|출처|Source)/.test(F.source)?F.source:'자료: '+F.source));\n  after.forEach(fn=>fn());\n  window.__RENDER_DONE__=true; window.__TEXT_ECHO__=root.innerText.replace(/\\s+/g,' ').trim();\n\n  // ───────────────────────── 공용 ─────────────────────────\n  function div(c){const e=document.createElement('div'); if(c)e.className=c; return e;}\n  function t(tag,c,txt){const e=document.createElement(tag); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;}\n  function stage(h){\n    const s=div('fm-stage'); s.style.width=W+'px'; s.style.height=h+'px';\n    const svg=el('svg',{width:W,height:h,viewBox:'0 0 '+W+' '+h});\n    svg.innerHTML='<defs><marker id=\"ah\" markerWidth=\"12\" markerHeight=\"10\" refX=\"10\" refY=\"5\" orient=\"auto\"><path d=\"M0,0 L12,5 L0,10 z\" class=\"s-mid\"/><\/marker>'+\n      '<marker id=\"aha\" markerWidth=\"12\" markerHeight=\"10\" refX=\"10\" refY=\"5\" orient=\"auto\"><path d=\"M0,0 L12,5 L0,10 z\" class=\"s-acc\"/><\/marker><\/defs>';\n    s.append(svg); root.append(s); return {el:s, svg, h, set h2(v){ s.style.height=v+'px'; svg.setAttribute('height',v); svg.setAttribute('viewBox','0 0 '+W+' '+v); }};\n  }\n  function el(tag,a,cls){const e=document.createElementNS(NS,tag); for(const k in (a||{})) e.setAttribute(k,a[k]); if(cls) e.setAttribute('class',cls); return e;}\n  function add(st,tag,a,cls){const e=el(tag,a,cls); st.svg.append(e); return e;}\n  // 글자 상자: anchor c(가운데) l(왼쪽 가운데) r(오른쪽 가운데) t(위 가운데) b(아래 가운데) tl(왼쪽 위)\n  function lab(st,x,y,w,parts,o){\n    o=o||{}; const e=div('fm-lbl '+(o.box||'')+' '+(o.cls||''));\n    const an=o.anchor||'c', tf={c:'translate(-50%,-50%)',l:'translate(0,-50%)',r:'translate(-100%,-50%)',t:'translate(-50%,0)',b:'translate(-50%,-100%)',tl:'none',tr:'translate(-100%,0)',bl:'translate(0,-100%)',br:'translate(-100%,-100%)'}[an];\n    e.style.left=x+'px'; e.style.top=y+'px'; if(w) e.style.width=w+'px'; e.style.transform=tf;\n    if(o.align==='l') e.classList.add('al'); if(o.align==='r') e.classList.add('ar');\n    parts.forEach(p=>{ if(p && p[0]!=null && p[0]!=='') e.append(t('div',p[1],p[0])); });\n    st.el.append(e); return e;\n  }\n  function bullets(items){ const b=div('bul'); (items||[]).forEach(s=>b.append(t('div',null,s))); return b; }\n  function rel(e,st){ const a=e.getBoundingClientRect(), b=st.el.getBoundingClientRect(); return {l:a.left-b.left,t:a.top-b.top,r:a.right-b.left,b:a.bottom-b.top,w:a.width,h:a.height,cx:(a.left+a.right)/2-b.left,cy:(a.top+a.bottom)/2-b.top}; }\n  function rad(d){ return d*Math.PI/180; }\n  function heat(i,n){ return n<=1||i===n-1 ? 's-heat3' : (i>=Math.ceil((n-1)/2) ? 's-heat2' : 's-heat1'); }\n  function heatTxt(c){ return c==='s-heat3' ? 'on3' : (c==='s-heat2' ? 'on2' : ''); }\n\n  // ───────────────────────── 1 cycle 순환 ─────────────────────────\n  // data: items[{title,desc,highlight}] 3~8, center{title,desc}?\n  function cycle(d){\n    const it=d.items, n=it.length, H=660, cx=W/2, cy=325, Rr=n<=4?215:n<=6?232:248, r=n<=5?86:n<=6?80:70;\n    const st=stage(H), g=Math.asin(Math.min(0.95,(r+12)/Rr))*180/Math.PI;\n    for(let i=0;i<n;i++){ const a=-90+360*i/n, b=a+360/n;\n      const p=q=>[cx+Rr*Math.cos(rad(q)), cy+Rr*Math.sin(rad(q))], s=p(a+g), e=p(b-g);\n      add(st,'path',{d:`M${s[0]} ${s[1]} A ${Rr} ${Rr} 0 0 1 ${e[0]} ${e[1]}`,'stroke-width':3,'marker-end':'url(#ah)'},'s-line'); }\n    if(d.center){ const cr=Math.max(78,Rr-r-46); add(st,'circle',{cx,cy,r:cr},'s-strong');\n      lab(st,cx,cy,cr*1.6,[[d.center.title,'t1'],[d.center.desc,'t2']],{cls:'onS'}); }\n    it.forEach((m,i)=>{ const a=-90+360*i/n, x=cx+Rr*Math.cos(rad(a)), y=cy+Rr*Math.sin(rad(a));\n      add(st,'circle',{cx:x,cy:y,r},m.highlight?'s-focus':'s-soft');\n      lab(st,x,y,r*1.75,[[m.tag,'t3'],[m.title,'t1s'],[m.desc,'t2']],{cls:m.highlight?'onF':''}); });\n  }\n\n  // ───────────────────────── 2 funnel 깔때기 ─────────────────────────\n  // data: stages[{label,value,note,drop}]  drop=이 단계로 넘어오며 빠진 것(강조색)\n  function funnel(d){\n    const s=d.stages, m=s.length, hh=84, gap=8, top=10, H=top+m*(hh+gap)+10, fx=450, W0=860, W1=Math.max(300,W0*0.36);\n    const st=stage(H), wAt=y=>W0-(W0-W1)*((y-top)/(m*(hh+gap)-gap));\n    s.forEach((g,i)=>{ const y0=top+i*(hh+gap), y1=y0+hh, a=wAt(y0)/2, b=wAt(y1)/2, c=heat(i,m);\n      add(st,'polygon',{points:`${fx-a},${y0} ${fx+a},${y0} ${fx+b},${y1} ${fx-b},${y1}`},c);\n      const L=lab(st,fx,(y0+y1)/2,b*2-20,[],{cls:heatTxt(c)}); const row=div(); row.style.cssText='display:flex;gap:16px;align-items:baseline;justify-content:center';\n      row.append(t('div','t1',g.label)); if(g.value!=null) row.append(t('div','tv',String(g.value))); L.append(row);\n      if(g.note){ add(st,'line',{x1:fx+b+8,y1:(y0+y1)/2,x2:fx+W0/2+60,y2:(y0+y1)/2},'s-grid'); lab(st,fx+W0/2+74,(y0+y1)/2,W-(fx+W0/2+74),[[g.note,'tx']],{anchor:'l',align:'l'}); }\n      if(g.drop){ const yy=y0-gap/2; lab(st,fx+W0/2+74,yy,W-(fx+W0/2+74),[[g.drop,'tx']],{anchor:'l',align:'l',box:'fm-accent'});\n        add(st,'line',{x1:fx+wAt(yy)/2+6,y1:yy,x2:fx+W0/2+68,y2:yy,'marker-end':'url(#aha)'},'s-accentl'); }\n    });\n  }\n\n  // ───────────────────────── 3 venn 교집합 ─────────────────────────\n  // data: sets[{title,desc}] 2~3, overlaps{\"12\":…,\"13\":…,\"23\":…,\"123\":…}\n  function venn(d){\n    const s=d.sets, n=s.length, o=d.overlaps||{}, H=660, st=stage(H), cls=['s-v1','s-v2','s-v3'];\n    if(n===2){ const r=235, c=[[W/2-155,330],[W/2+155,330]];\n      c.forEach((p,i)=>add(st,'circle',{cx:p[0],cy:p[1],r},cls[i]));\n      [[c[0][0]-r/2-35,0],[c[1][0]+r/2+35,1]].forEach(([x,i])=>lab(st,x,330,190,[[s[i].title,'t1'],[s[i].desc,'t2']]));\n      if(o['12']) lab(st,W/2,330,150,[[o['12'],'t1s']]);\n    } else { const r=212, dd=132, C=[W/2,368], dir=[-90,150,30].map(a=>[Math.cos(rad(a)),Math.sin(rad(a))]);\n      const c=dir.map(v=>[C[0]+v[0]*dd, C[1]+v[1]*dd]);\n      c.forEach((p,i)=>add(st,'circle',{cx:p[0],cy:p[1],r},cls[i]));\n      dir.forEach((v,i)=>lab(st,C[0]+v[0]*(dd+r*0.52),C[1]+v[1]*(dd+r*0.52),180,[[s[i].title,'t1'],[s[i].desc,'t2']]));\n      [['12',0,1],['13',0,2],['23',1,2]].forEach(([k,a,b])=>{ if(!o[k]) return; const vx=dir[a][0]+dir[b][0], vy=dir[a][1]+dir[b][1], L=Math.hypot(vx,vy);\n        lab(st,C[0]+vx/L*dd*1.08,C[1]+vy/L*dd*1.08,130,[[o[k],'tx']]); });\n      if(o['123']) lab(st,C[0],C[1],110,[[o['123'],'t1s']]);\n    }\n  }\n\n  // ───────────────────────── 4 quadrant 2×2 ─────────────────────────\n  // data: x{label,low,high}, y{label,low,high}, quadrants[{title,desc}] 순서 TL,TR,BL,BR,\n  //       items[{label,_x,_y,highlight}] (0~1), _focus:\"TR\", takeaway\n  function quadrant(d){\n    const H=660, pw=820, ph=540, side=d.takeaway?360:0, L=d.takeaway?120:(W-pw)/2+30, T=20, st=stage(H);\n    const pos=['TL','TR','BL','BR'];\n    pos.forEach((p,i)=>{ const x=L+(p[1]==='R'?pw/2:0), y=T+(p[0]==='B'?ph/2:0), R=p[1]==='R', B=p[0]==='B';\n      add(st,'rect',{x,y,width:pw/2,height:ph/2},(d._focus===p)?'s-soft':'s-faint');\n      const q=(d.quadrants||[])[i]; if(!q) return;\n      lab(st,x+(R?pw/2-18:18),y+(B?ph/2-16:16),pw/2-60,[[q.title,'t1'],[q.desc,'t3']],{anchor:(B?'b':'t')+(R?'r':'l'),align:R?'r':'l'}); });\n    add(st,'line',{x1:L+pw/2,y1:T,x2:L+pw/2,y2:T+ph},'s-grid'); add(st,'line',{x1:L,y1:T+ph/2,x2:L+pw,y2:T+ph/2},'s-grid');\n    add(st,'line',{x1:L,y1:T+ph,x2:L+pw+26,y2:T+ph,'marker-end':'url(#ah)'},'s-line');\n    add(st,'line',{x1:L,y1:T+ph,x2:L,y2:T-24,'marker-end':'url(#ah)'},'s-line');\n    lab(st,L+pw/2,T+ph+30,pw,[[d.x.label,'t1s']],{});\n    if(d.x.low) lab(st,L,T+ph+30,160,[[d.x.low,'t3']],{anchor:'l',align:'l'}); if(d.x.high) lab(st,L+pw,T+ph+30,160,[[d.x.high,'t3']],{anchor:'r',align:'r'});\n    lab(st,L-18,T+ph/2,90,[[d.y.label,'t1s']],{anchor:'r',align:'r'});\n    if(d.y.high) lab(st,L-18,T+6,90,[[d.y.high,'t3']],{anchor:'r',align:'r'}); if(d.y.low) lab(st,L-18,T+ph-6,90,[[d.y.low,'t3']],{anchor:'r',align:'r'});\n    (d.items||[]).forEach(m=>{ const x=L+m._x*pw, y=T+(1-m._y)*ph;\n      add(st,'circle',{cx:x,cy:y,r:m.highlight?11:8},m.highlight?'s-acc':'s-deep');\n      lab(st,x+16,y,210,[[m.label,m.highlight?'t1s':'tx']],{anchor:'l',align:'l'}); });\n    if(d.takeaway) lab(st,W-side/2+10,T+ph/2,side-40,[[d.takeaway,'t1s']],{box:'fm-focus'});\n  }\n\n  // ───────────────────────── 5 pyramid 위계 ─────────────────────────\n  // data: levels[{title,desc}] 위→아래\n  function pyramid(d){\n    const lv=d.levels, m=lv.length, lh=m<=4?104:88, gap=6, T=10, H=T+m*(lh+gap)+10, cx=390, BW=720, st=stage(H);\n    const wAt=y=>BW*((y-T)/(m*(lh+gap)-gap));\n    lv.forEach((v,i)=>{ const y0=T+i*(lh+gap), y1=y0+lh, a=wAt(y0)/2, b=wAt(y1)/2, c=i===0?'s-heat3':(i<m/2?'s-heat2':'s-heat1');\n      add(st,'polygon',{points:`${cx-a},${y0} ${cx+a},${y0} ${cx+b},${y1} ${cx-b},${y1}`},c);\n      const yc=i===0?y0+lh*0.66:(y0+y1)/2; lab(st,cx,yc,Math.max(120,(a+b)-30),[[v.title,i===0?'t1s':'t1']],{cls:heatTxt(c)});\n      if(v.desc){ add(st,'line',{x1:cx+b+6,y1:(y0+y1)/2,x2:cx+BW/2+50,y2:(y0+y1)/2},'s-grid');\n        lab(st,cx+BW/2+64,(y0+y1)/2,W-(cx+BW/2+64),[[v.desc,'tx']],{anchor:'l',align:'l'}); } });\n  }\n\n  // ───────────────────────── 6 concentric 동심원 ─────────────────────────\n  // data: rings[{title,desc}] 안→밖\n  function concentric(d){\n    const rg=d.rings, n=rg.length, Rm=300, H=2*Rm+30, cx=Rm+40, cy=H/2, st=stage(H);\n    const cl=i=> i===0?'s-strong': (i===n-1?'s-faint': (i===1?'s-heat2':'s-soft'));\n    for(let i=n-1;i>=0;i--) add(st,'circle',{cx,cy,r:Rm*(i+1)/n},cl(i));\n    rg.forEach((g,i)=>{ const r0=Rm*i/n, r1=Rm*(i+1)/n;\n      if(i===0) lab(st,cx,cy,r1*1.6,[[g.title,'t1']],{cls:'onS'});\n      else lab(st,cx,cy-(r0+r1)/2,2*Math.sqrt(r1*r1-((r0+r1)/2)**2)*0.9,[[g.title,'t1s']],{cls:i===1?'on2':''}); });\n    const x0=2*Rm+130, rowH=(H-40)/n;\n    rg.forEach((g,i)=>{ const y=20+rowH*i+rowH/2; add(st,'rect',{x:x0,y:y-14,width:28,height:28,rx:4},cl(i));\n      lab(st,x0+44,y,W-x0-44,[[g.title,'t1s'],[g.desc,'t2']],{anchor:'l',align:'l'}); });\n  }\n\n  // ───────────────────────── 7 hub 허브·방사 ─────────────────────────\n  // data: center{title,desc}, nodes[{title,desc}] 3~8\n  function hub(d){\n    const nd=d.nodes, n=nd.length, H=660, cx=W/2, cy=330, rx=500, ry=245, st=stage(H);\n    const pts=nd.map((_,i)=>{ const a=-90+360*i/n; return [cx+rx*Math.cos(rad(a)), cy+ry*Math.sin(rad(a))]; });\n    pts.forEach(p=>add(st,'line',{x1:cx,y1:cy,x2:p[0],y2:p[1]},'s-line'));\n    lab(st,cx,cy,270,[[d.center.title,'t1'],[d.center.desc,'t2']],{box:'fm-strong'});\n    nd.forEach((m,i)=>lab(st,pts[i][0],pts[i][1],250,[[m.title,'t1s'],[m.desc,'t2']],{box:m.highlight?'fm-focus':'fm-edge'}));\n  }\n\n  // ───────────────────────── 8 fishbone 원인 ─────────────────────────\n  // data: effect{title,desc}, categories[{title,causes[]}] 4~6\n  function fishbone(d){\n    const cs=d.categories, H=640, cy=320, x0=40, x1=W-270, st=stage(H);\n    add(st,'line',{x1:x0,y1:cy,x2:x1,y2:cy,'stroke-width':4,'marker-end':'url(#ah)'},'s-line');\n    lab(st,W-128,cy,240,[[d.effect.title,'t1'],[d.effect.desc,'t2']],{box:'fm-focus'});\n    const top=cs.filter((_,i)=>i%2===0), bot=cs.filter((_,i)=>i%2===1), dx=150, dy=240;\n    [[top,-1],[bot,1]].forEach(([grp,sg])=>{ const k=grp.length, span=(x1-x0-60);\n      grp.forEach((c,j)=>{ const xa=x0+80+dx+span*(j+0.5)/k, ya=cy, xb=xa-dx, yb=cy+sg*dy;\n        add(st,'line',{x1:xb,y1:yb,x2:xa,y2:ya},'s-line');\n        lab(st,xb,yb+sg*22,null,[[c.title,'t1s']],{box:'fm-pill'}).style.whiteSpace='nowrap';\n        const cc=c.causes||[]; cc.forEach((z,q)=>{ const f=(q+1)/(cc.length+1), px=xb+(xa-xb)*f, py=yb+(ya-yb)*f;\n          add(st,'line',{x1:px-70,y1:py,x2:px,y2:py},'s-thin'); lab(st,px-78,py,190,[[z,'tx']],{anchor:'r',align:'r'}); }); }); });\n  }\n\n  // ───────────────────────── 9 staircase 계단 ─────────────────────────\n  // data: steps[{title,desc,tag}] 아래→위, goal(마지막 계단 위 깃발 글)\n  function staircase(d){\n    const sp=d.steps, n=sp.length, H=580, base=H-10, cw=(W-40)/n, sh=(H-190)/n, st=stage(H);\n    sp.forEach((s,i)=>{ const x=20+i*cw, h=120+sh*i, y=base-h, last=i===n-1;\n      add(st,'rect',{x,y,width:cw-12,height:h,rx:6},last?'s-focus':(i%2?'s-soft':'s-heat1'));\n      lab(st,x+(cw-12)/2,y+16,cw-40,[[s.tag,'t3'],[s.title,'t1'],[s.desc,'t2']],{anchor:'t',cls:last?'onF':''}); });\n    if(d.goal){ const x=20+(n-1)*cw+(cw-12)/2, y=base-(120+sh*(n-1)); lab(st,x,y-16,cw+40,[[d.goal,'t1s']],{anchor:'b',box:'fm-accent'}); }\n  }\n\n  // ───────────────────────── 10 before-after 전후 ─────────────────────────\n  // data: before{title,items[]}, after{title,items[]}, levers[] (전환 수단)\n  function beforeAfter(d){\n    const row=div(); row.style.cssText='display:flex;align-items:stretch;gap:0;width:'+W+'px;margin:0 auto'; root.append(row);\n    const card=(o,cls)=>{ const c=div(cls); c.style.cssText='flex:0 0 470px;padding:0;overflow:hidden;display:flex;flex-direction:column';\n      const h=div(cls==='fm-muted'?'':'fm-focus'); h.style.cssText='border-radius:0;box-shadow:none;padding:14px 20px;'+(cls==='fm-muted'?'background:var(--neutral-head);':'');\n      const ht=t('div','t1',o.title); if(cls==='fm-muted') ht.style.color='var(--strong-ink)'; h.append(ht); c.append(h);\n      const b=bullets(o.items); b.style.cssText+='padding:18px 22px;font-size:calc(18px * var(--fts));line-height:1.7'; c.append(b); return c; };\n    row.append(card(d.before,'fm-muted'));\n    const mid=div(); mid.style.cssText='flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:0 10px';\n    const arr=div('fm-soft'); arr.style.cssText='width:100%;min-height:78%;clip-path:polygon(0 12%,78% 12%,78% 0,100% 50%,78% 100%,78% 88%,0 88%);border:none;display:flex;flex-direction:column;justify-content:center;padding:40px 110px 40px 26px;border-radius:0';\n    (d.levers||[]).forEach(s=>arr.append(t('div','t1s',s))); if(d.lever_title) arr.prepend(t('div','t3',d.lever_title));\n    arr.querySelectorAll('.t1s').forEach(e=>e.style.margin='5px 0'); mid.append(arr); row.append(mid);\n    row.append(card(d.after,'fm-edge'));\n  }\n\n  // ───────────────────────── 11 waterfall 증감 ─────────────────────────\n  // data: start{label,value}, steps[{label,value}] (±), end{label,value?}, unit\n  function waterfall(d){\n    const H=560, T=40, PH=400, st=stage(H), sp=d.steps, n=sp.length+2, cw=(W-60)/n, bw=Math.min(120,cw*0.6), u=d.unit||'';\n    let run=d.start.value; const bars=[{lb:d.start.label,y0:0,y1:run,c:'s-heat2',v:run}];\n    sp.forEach(s=>{ const a=run; run+=s.value; bars.push({lb:s.label,y0:Math.min(a,run),y1:Math.max(a,run),c:s.value>=0?'s-deep':'s-acc',v:(s.value>0?'+':'')+s.value,top:Math.max(a,run),lvl:run}); });\n    // 끝값을 적었으면 '시작 + 증감'과 맞아야 한다 — 틀린 합계를 그림이 조용히 그리지 않게 멈춘다\n    if(d.end&&d.end.value!=null&&Math.abs(d.end.value-run)>1e-9) throw new Error('합계 불일치: 시작+증감='+run+', end.value='+d.end.value);\n    const endv=d.end&&d.end.value!=null?d.end.value:run; bars.push({lb:(d.end||{}).label||'합계',y0:0,y1:endv,c:'s-strong',v:endv});\n    // 증감이 총액에 비해 작으면 축 하단을 생략한다 (≈ 표시) — 0부터 그리면 증감이 안 보인다\n    const lvls=[]; bars.forEach((b,i)=>{ if(i===0||i===bars.length-1) lvls.push(b.y1); else lvls.push(b.y0,b.y1); });\n    const hi=Math.max(...lvls), lo=Math.min(...lvls), cut=lo>0 && (hi-lo)<hi*0.5;\n    const fl=cut? Math.max(0, lo-(hi-lo)*1.2) : 0, mx=fl+(hi-fl)*1.12, Y=v=>T+PH-((v-fl)/(mx-fl))*PH;\n    bars.forEach(b=>{ if(b.y0===0) b.y0=fl; });\n    add(st,'line',{x1:20,y1:T+PH,x2:W-20,y2:T+PH},'s-axis');\n    if(cut){ [0,bars.length-1].forEach(i=>{ const x=30+i*cw+(cw-bw)/2; add(st,'path',{d:`M${x-6} ${T+PH-26} l${bw+12} -10 M${x-6} ${T+PH-16} l${bw+12} -10`,'stroke':'var(--bg)','stroke-width':6,fill:'none'});\n        add(st,'path',{d:`M${x-6} ${T+PH-26} l${bw+12} -10 M${x-6} ${T+PH-16} l${bw+12} -10`},'s-thin'); });\n      lab(st,24,T+PH+44,300,[['※ 세로축 하단 일부 생략','t3']],{anchor:'l',align:'l'}); }\n    bars.forEach((b,i)=>{ const x=30+i*cw+(cw-bw)/2;\n      add(st,'rect',{x,y:Y(b.y1),width:bw,height:Math.max(2,Y(b.y0)-Y(b.y1))},b.c);\n      lab(st,x+bw/2,Y(b.y1)-8,cw,[[String(b.v)+u,'t1s']],{anchor:'b'});\n      lab(st,x+bw/2,T+PH+12,cw-8,[[b.lb,'tx']],{anchor:'t'});\n      if(i<bars.length-1){ const lv=i===0?b.y1:(b.lvl!=null?b.lvl:b.y1); add(st,'line',{x1:x+bw,y1:Y(lv),x2:x+cw,y2:Y(lv)},'s-grid'); } });\n  }\n\n  // ───────────────────────── 12 iceberg 드러난/숨은 ─────────────────────────\n  // data: above{title,items[]}, below{title,items[]}\n  function iceberg(d){\n    const H=680, wl=210, cx=430, st=stage(H);\n    add(st,'rect',{x:0,y:wl,width:W,height:H-wl},'s-water');\n    add(st,'line',{x1:0,y1:wl,x2:W,y2:wl},'s-dash');\n    add(st,'polygon',{points:`${cx-120},${wl} ${cx-60},${wl-120} ${cx-10},${wl-175} ${cx+45},${wl-110} ${cx+110},${wl-60} ${cx+140},${wl}`},'s-edge');\n    add(st,'polygon',{points:`${cx-120},${wl} ${cx+140},${wl} ${cx+260},${wl+140} ${cx+300},${wl+300} ${cx+150},${H-20} ${cx-160},${H-35} ${cx-300},${wl+320} ${cx-250},${wl+130}`},'s-heat2');\n    const a=lab(st,cx+230,wl-100,560,[[d.above.title,'t1']],{anchor:'l',align:'l'}); a.append(bullets(d.above.items));\n    const b=lab(st,cx,wl+(H-wl)/2,430,[[d.below.title,'t1']],{align:'l',cls:'on2'}); b.append(bullets(d.below.items)); b.querySelector('.bul').style.fontSize='calc(17px * var(--fts))';\n    b.querySelector('.bul').style.color='var(--heat-2-ink)';\n    if(d.note) lab(st,W-20,H-20,380,[[d.note,'t1s']],{anchor:'r',box:'fm-strong',cls:''}).style.transform='translate(-100%,-100%)';\n  }\n\n  // ───────────────────────── 13 swimlane 주체별 흐름 ─────────────────────────\n  // data: lanes[], phases[]?, steps[{text,_lane,_col,highlight}] (배열 순서대로 화살표)\n  function swimlane(d){\n    const ln=d.lanes, sp=d.steps, C=Math.max(...sp.map(s=>s._col))+1, LW=160, top=d.phases?46:0, lh=128, H=top+ln.length*lh, cw=(W-LW)/C, st=stage(H);\n    if(d.phases) d.phases.forEach((p,i)=>lab(st,LW+cw*i+cw/2,20,cw-10,[[p,'t1s']]));\n    ln.forEach((l,i)=>{ const y=top+i*lh; add(st,'rect',{x:LW,y,width:W-LW,height:lh},i%2?'s-faint':'s-card');\n      add(st,'rect',{x:0,y,width:LW-8,height:lh-4,rx:6},'s-strong'); lab(st,(LW-8)/2,y+lh/2,LW-24,[[l,'t1s']],{cls:'onS'}); });\n    for(let i=1;i<C;i++) add(st,'line',{x1:LW+cw*i,y1:top,x2:LW+cw*i,y2:H},'s-grid');\n    const boxes=sp.map(s=>lab(st,LW+cw*s._col+cw/2,top+s._lane*lh+lh/2,Math.min(230,cw-44),[[s.text,'tx']],{box:s.highlight?'fm-focus':'fm-edge'}));\n    after.push(()=>{ for(let i=0;i<sp.length-1;i++){ const a=rel(boxes[i],st), b=rel(boxes[i+1],st);\n      if(Math.abs(a.cy-b.cy)<2) add(st,'line',{x1:a.r,y1:a.cy,x2:b.l-4,y2:b.cy,'marker-end':'url(#ah)'},'s-line');\n      else if(Math.abs(a.cx-b.cx)<2) add(st,'line',{x1:a.cx,y1:a.cy<b.cy?a.b:a.t,x2:b.cx,y2:a.cy<b.cy?b.t-4:b.b+4,'marker-end':'url(#ah)'},'s-line');\n      else { const mx=(a.r+b.l)/2; add(st,'path',{d:`M${a.r} ${a.cy} H${mx} V${b.cy} H${b.l-4}`,'marker-end':'url(#ah)'},'s-line'); } } });\n  }\n\n  // ───────────────────────── 14 logic-tree 이슈 트리 ─────────────────────────\n  // data: root{title,desc}, children[{title,children[{title}]}]\n  function logicTree(d){\n    const ch=d.children, leaves=ch.reduce((s,c)=>s+Math.max(1,(c.children||[]).length),0), rh=66, H=leaves*rh+20, st=stage(H);\n    const X0=150, X1=560, X2=1030; let row=0; const l1=[];\n    ch.forEach(c=>{ const k=Math.max(1,(c.children||[]).length), ys=[]; for(let j=0;j<k;j++) ys.push(10+(row+j)*rh+rh/2);\n      const yc=(ys[0]+ys[ys.length-1])/2; const b1=lab(st,X1,yc,270,[[c.title,'t1s'],[c.desc,'t3']],{box:'fm-soft'});\n      const kids=(c.children||[]).map((g,j)=>lab(st,X2,ys[j],360,[[g.title,'tx']],{box:'fm-card',align:'l'}));\n      l1.push({b1,kids}); row+=k; });\n    const rb=lab(st,X0,H/2,250,[[d.root.title,'t1'],[d.root.desc,'t2']],{box:'fm-strong'});\n    after.push(()=>{ const r=rel(rb,st);\n      l1.forEach(({b1,kids})=>{ const a=rel(b1,st), mx=(r.r+a.l)/2; add(st,'path',{d:`M${r.r} ${r.cy} H${mx} V${a.cy} H${a.l}`},'s-line');\n        kids.forEach(k=>{ const b=rel(k,st), m2=(a.r+b.l)/2; add(st,'path',{d:`M${a.r} ${a.cy} H${m2} V${b.cy} H${b.l}`},'s-thin'); }); }); });\n  }\n})();\n<\/script>\n\n<script id=\"jf-loader\">\n(function(){\n  var C = {\"page\": true, \"W\": 1920, \"H\": 1080, \"PAD\": 64, \"embed\": true, \"concept\": \"soft\", \"M\": 40, \"font\": \"pretendard\", \"fontFamily\": \"Pretendard\", \"minPc\": 16.0, \"maxPc\": 60};\n  var olds = Array.prototype.slice.call(document.querySelectorAll('script[type=\"text/jf-deferred\"]'));\n  var texts ion-size·src-size·title-scale·word-break) */\n  /* --- 팔레트 --- */\n  --navy-deep:   #A49393;   /* 뱃지·헤더밴드·푸터칩·누적박스 */\n  --navy-mid:    #E8B4B8;   /* 보조 강조 */\n  --navy-marker: #B98A90;   /* 게이트 ▼ · 마일스톤 ◆ */\n  --bar-fill:    #F3F2F2;   /* 간트바 채움 (연) */\n  --bar-fill-2:  #E7E4E4;   /* 간트바 채움 (진) */\n  --bar-border:  #E8B4B8;   /* 간트바 테두리 */\n  --grid-line:   #E2DADA;   /* 월 구분 점선·격자 */\n  --ink:         #2B2222;   /* 본문 텍스트 */\n  --ink-soft:    #5E4F4F;   /* 부제·캡션 */\n  --bg:          #FFFFFF;   /* 배경 (항상 흰색) */\n  --chip-track:  #E7E4E4;   /* 도넛 트랙 */\n\n  /* --- 확장 토큰 (추가만 — 기존 값 불변) --- */\n  --heat-1:      #F6E1E3;   /* 판정 히트맵 1단계(약) */\n  --heat-2:      #E8B4B8;   /* 판정 히트맵 2단계(중) */\n  --heat-3:      #A49393;   /* 판정 히트맵 3단계(강) */\n  --heat-1-ink:  #2B2222;\n  --heat-2-ink:  #2B2222;\n  --heat-3-ink:  #2B2222;\n  --neutral-fill:#F4F3F3;   /* 기준(무채색) 열·보조 바탕 */\n  --neutral-line:#CEC5C5;   /* 무채색 테두리 */\n  --neutral-ink: #5E5050;   /* 무채색 본문 */\n  --accent:      #B98A90;   /* 강조색 — 병목·미통과 분기 */\n  --accent-soft: #F2E2E4;   /* 강조 배경 */\n  --track-1:     #A49393;   /* 타임라인 축1 진남색 */\n  --track-2:     #7E7777;   /* 타임라인 축2 청회색 */\n  --track-3:     #B7AEAE;   /* 타임라인 축3 옅은 회색 */\n  /* --- 보조 선·바탕 (템플릿 하드코딩 제거분) --- */\n  --neutral-head:#695959;\n  --line-soft:   #DAD7D7;\n  --fill-faint:  #F9F8F8;\n  --line-track:  #D0C8C8;\n\n\n  /* --- 타이포 --- */\n  --font: \"Presentation\", \"PresentationVariable\", \"Pretendard\", \"Apple SD Gothic Neo\", \"NanumSquare\", \"NanumGothic\", \"Malgun Gothic\", sans-serif;\n  --w-title: 800;\n  --w-strong: 700;\n  --w-label: 600;\n  --w-body: 500;\n\n  /* --- 형태 --- */\n  --radius-bar: 12px;\n  --radius-box: 18px;\n  --radius-badge: 30%;\n  --shadow: 0 0 0 transparent;\n\n  /* --- 형태 (v1.1 — 색이 아니라 '생김새'를 바꾸는 토큰) ---\n     기본값은 v1.0 모양과 같다. 값을 바꾸면 11종이 한꺼번에 다른 인상이 된다. */\n  --font-title:  \"Presentation\", \"PresentationVariable\", \"Pretendard\", \"Apple SD Gothic Neo\", \"NanumSquare\", \"NanumGothic\", \"Malgun Gothic\", sans-serif;   /* 제목 글꼴 — 본문(--font)과 따로 */\n  --title-align: left;       /* center | left */\n  --title-scale: 1.3;            /* 제목 크기 배율 */\n  --title-ink:   #2B2222;\n  --title-track: -1px;         /* 제목 자간 */\n  --title-deco:  none;        /* 제목 양옆 장식선: block | none */\n  --title-under: 0 solid transparent;   /* 제목 아래 가로줄 (border 값) */\n  --title-under-gap: 0px;\n  --caption-align: center;\n  --caption-ink: var(--ink);\n  --strong-fill: var(--navy-deep);      /* 강조 상자(헤더 띠·뿌리 상자·최종 단계) 채움 */\n  --strong-ink:  #2B2222;\n  --strong-ink-soft: #5E4F4F;\n  --strong-ring: inset 0 0 0 0 transparent;   /* 강조 상자 안쪽 테두리 — 외곽선형이면 inset 0 0 0 2px 색 */\n  --card-fill:   #FFFFFF;               /* 일반 카드 바탕 */\n  --badge-shape: 30%;                   /* 번호 뱃지·단계 원 — 50%=원, 4px=사각 */\n  --radius-pill: 18px;                 /* 알약형 칩 — 각지게 하려면 작은 값 */\n  --word-break: keep-all;                 /* keep-all = 한국어 낱말 단위 줄바꿈 */\n  --shadow-hub:  0 0 0 transparent;   /* 논증 도해 중심 상자 그림자 */\n\n  /* --- 편집 (v1.3 — 보고서·도판식 배치. 기본값은 v1.2 와 같다) --- */\n  --fig-display: flex;        /* flex 로 두면 캡션을 제목 위로 올릴 수 있다 */\n  --caption-order: 0;          /* -1 = 그림 번호·제목을 맨 위로 (국내 보고서 관례) */\n  --caption-mt: 1;             /* 캡션 위 여백 배율 (위로 올릴 땐 0) */\n  --caption-mb: 0px;\n  --caption-size: 30px;\n  --caption-weight: var(--w-label);\n  --src-size: 27px;            /* 자료·주 줄 */\n  --src-gap: 12px;\n  --title-tag: block;           /* block = 제목 위 짧은 색 막대 (도판식 표식) */\n  --title-tag-color: #E8B4B8;\n  --accent-line: solid;       /* 강조(탈락·병목) 상자 테두리: dashed | solid */\n  --accent-fill: var(--accent-soft);   /* 강조 상자 바탕 — transparent 면 글자와 선만 */\n  --focus-fill:  var(--strong-fill);     /* highlight 로 지정한 '제목이 말하는 그 요소' — 구조용 강조와 분리 */\n  --focus-ink:   #2B2222;\n  --focus-ink-soft: #5E4F4F;\n  --focus-ring:  var(--strong-ring);\n  --trim-x:      auto;         /* none = PNG 좌우 여백을 자르지 않는다 — 문서 속 그림 폭을 모두 같게 */\n  --text-scale:  2.0;            /* 도식 안 글자 배율 (제목은 --title-scale, 캡션·자료는 --caption-size·--src-size) */\n  --ornament:    none;         /* none = 뜻 없이 겹치는 장식(중복 번호 뱃지 등)을 걷는다 */\n\n  /* --- board (v2.0) — 뜻으로 고르는 색 6가지 + 조립 부품 --- */\n  --tone-main: #A49393; --tone-main-tint: #EED6D3; --tone-main-line: #EED6D3;\n  --tone-sub: #E8B4B8; --tone-sub-tint: #F6E1E3; --tone-sub-line: #F6E1E3;\n  --tone-go: #C7AFAD; --tone-go-tint: #EFE6E5; --tone-go-line: #EFE6E5;\n  --tone-wait: #EED6D3; --tone-wait-tint: #F8EDEB; --tone-wait-line: #F8EDEB;\n  --tone-stop: #B98A90; --tone-stop-tint: #F2E2E4; --tone-stop-line: #F2E2E4;\n  --tone-mute: #CFC6C4; --tone-mute-tint: #EEEAE9; --tone-mute-line: #EEEAE9;\n  --board-font: \"Presentation\", \"PresentationVariable\", \"Pretendard\", \"Apple SD Gothic Neo\", \"NanumSquare\", \"NanumGothic\", \"Malgun Gothic\", sans-serif;\n  --board-fs: 22px;                 /* 본문 기준 글자 — 그림 폭 1500px 의 1.5% (16cm 삽입 시 약 6.6pt) */\n  --board-line: #E9DCDA;\n  --board-panel: #FBF5F4;\n  --board-chip: #F6E1E3;\n  --board-radius: 18px;\n  --board-icon-stroke: 1.8;\n  --board-link-w: 3px;\n  --board-band-label: rgba(0, 0, 0, 0.18);\n  --board-bar-sep: rgba(255, 255, 255, 0.35);\n  --board-step-mid: #D5D2D2;\n  /* --- /board --- */\n\n  /* --- viz (v2.2) — 그라데이션·입체 스위치. 0 = 평면(기본). design-report 프리셋만 켠다 --- */\n  --gloss: 0;                       /* 0~0.35 — 도형 위 밝은 그라데이션의 세기 */\n  --solid: 0;                       /* 1 = 깔때기 타원 테·둥근 막대 끝 같은 입체 표현 */\n}\n\n/* =========================================================================\n   board — 조립형 도식 엔진 (v2.0)\n   내용에 맞춰 배치를 새로 짠다. 같은 상자를 격자로 늘어놓지 않는다.\n   행(row)·열(col)·묶음(group) 안에 부품(카드·띠·알약·단계·칩·마름모·시간 띠·\n   미니 매트릭스·키-값·목록)을 넣고, id 로 화살표를 잇는다.\n   색은 '뜻'으로 고른다 — main(본체·진행) sub(보조) go(산출·통과·투입)\n   wait(주의·대기·예시) stop(탈락·제약) mute(기존·관찰·비교 기준).\n   ========================================================================= */\n* { margin:0; padding:0; box-sizing:border-box; }\nhtml,body { background:#fff; }\n:root { --B: var(--board-fs); }\n#figure { width:1500px; background:var(--bg); font-family:var(--board-font); color:var(--ink);\n  padding:34px 40px 28px; position:relative; word-break:keep-all; overflow-wrap:break-word;\n  -webkit-font-smoothing:antialiased; line-height:1.4; }\n#figure.fs-s { --B: calc(var(--board-fs) * 0.9); }\n#figure.fs-l { --B: calc(var(--board-fs) * 1.1); }\n\n/* ---- 머리 ---- */\n.hd { margin-bottom:24px; position:relative; }\n.hd.headline { padding-left:26px; border-bottom:2px solid var(--board-line); padding-bottom:18px; }\n.hd.headline::before { content:\"\"; position:absolute; left:0; top:4px; bottom:20px; width:9px; background:var(--tone-go); }\n.hd .kicker { font-size:calc(var(--B) * 0.95); font-weight:700; color:var(--tone-go); margin-bottom:4px; }\n.hd h1 { font-family:var(--board-font); font-size:calc(var(--B) * 1.35); font-weight:800; color:var(--tone-main); letter-spacing:-0.5px; line-height:1.25; }\n.hd .sub { margin-top:8px; font-size:calc(var(--B) * 0.9); font-weight:500; color:var(--ink-soft); }\n.hd .tag { position:absolute; right:0; top:0; background:var(--tone-wait-tint); color:var(--tone-wait); font-weight:700;\n  font-size:calc(var(--B) * 0.82); padding:6px 16px; border-radius:var(--board-radius); }\n.hd.plain h1 { font-size:calc(var(--B) * 1.3); }\n.hd.center { text-align:center; }\n.hd.center h1 { font-size:calc(var(--B) * 1.25); }\n.hd.bar { background:var(--tone-main-tint); border-radius:var(--board-radius); overflow:hidden; padding:0 0 12px; border:1.5px solid var(--tone-main-line); }\n.hd.bar.nosub { padding-bottom:0; }\n.hd.bar .barrow { display:flex; align-items:stretch; background:var(--tone-main); color:#fff; }\n.hd.bar .num { padding:12px 22px; font-weight:800; font-size:calc(var(--B) * 1.2); border-right:1.5px solid var(--board-bar-sep); white-space:nowrap; }\n.hd.bar h1 { color:#fff; padding:12px 24px; font-size:calc(var(--B) * 1.2); }\n.hd.bar .sub { padding:0 24px; margin-top:10px; color:var(--tone-main); font-weight:600; }\n.hd.bar .tag { top:auto; bottom:8px; right:12px; }\n.caption-top { text-align:center; font-size:calc(var(--B) * 1.05); font-weight:700; margin-bottom:16px; }\n\n/* ---- 배치 ---- */\n.row { display:flex; align-items:stretch; gap:var(--gap, 18px); }\n.col { display:flex; flex-direction:column; gap:var(--gap, 14px); }\n.row > *, .col > * { min-width:0; }\n.row > .grow { flex:1 1 0; }\n.row.a-center { align-items:center; } .row.a-start { align-items:flex-start; } .row.a-end { align-items:flex-end; }\n.col.j-center { justify-content:center; } .col.j-between { justify-content:space-between; }\n.jn { flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:var(--tone-sub); }\n.row > .jn { width:30px; margin:0 -6px; } .col > .jn { height:26px; margin:-5px 0; }\n.jn svg { display:block; }\n.jn.plus, .jn.eq { font-size:calc(var(--B) * 1.5); font-weight:800; color:var(--tone-main); }\n\n/* ---- 묶음 ---- */\n.group { border:2px solid var(--tc, var(--tone-main)); border-radius:calc(var(--board-radius) + 4px); background:var(--board-panel); display:flex; flex-direction:column; overflow:hidden; }\n.group > .gh { background:var(--tc, var(--tone-main)); color:#fff; font-weight:800; text-align:center; font-size:calc(var(--B) * 1.0); padding:9px 14px; }\n.group > .gh.left { text-align:left; }\n.group > .gh .gs { font-weight:500; opacity:.85; margin-left:12px; font-size:calc(var(--B) * 0.82); }\n.group > .gb { padding:16px; flex:1; display:flex; flex-direction:column; gap:14px; }\n.group.soft { border-width:1.5px; border-color:var(--tl, var(--tone-main-line)); }\n.group.soft > .gh { background:var(--tt, var(--tone-main-tint)); color:var(--tc, var(--tone-main)); }\n.group.bare { border:none; background:none; } .group.bare > .gb { padding:0; }\n.group.dash { border-style:dashed; }\n\n/* ---- 카드 ---- */\n.card { position:relative; background:var(--card-bg, #fff); border:1.5px solid var(--tl, var(--board-line)); border-radius:var(--board-radius);\n  padding:14px 18px; display:flex; flex-direction:column; gap:7px; }\n.card.center { align-items:center; text-align:center; }\n.card.mid { justify-content:center; }\n.card.f-tint { --card-bg: var(--tt, var(--tone-main-tint)); }\n.card.f-panel { --card-bg: var(--board-panel); }\n.card.f-solid { --card-bg: var(--tc, var(--tone-main)); border-color:var(--tc, var(--tone-main)); color:#fff; }\n.card.f-solid .ct, .card.f-solid .cs, .card.f-solid li { color:#fff; }\n.card.f-solid li::before { background:#fff; }\n.card.f-dash { --card-bg: var(--tt, var(--tone-stop-tint)); border-style:dashed; border-color:var(--tc, var(--tone-stop)); }\n.card.f-dash .ct { color:var(--tc, var(--tone-stop)); }\n.card.ac-left { padding-left:26px; } .card.ac-left::before { content:\"\"; position:absolute; left:-1.5px; top:-1.5px; bottom:-1.5px; width:8px; background:var(--tc, var(--tone-main)); border-radius:var(--board-radius) 0 0 var(--board-radius); }\n.card.ac-top { border-top:6px solid var(--tc, var(--tone-main)); }\n.card.has-head { padding:0; overflow:hidden; }\n.card.has-head > .chd { align-self:stretch; }\n.card.has-head > .body { padding:12px 16px 14px; display:flex; flex-direction:column; gap:7px; flex:1; }\n.card.has-head.center > .body { align-items:center; }\n.card .chd { background:var(--tc, var(--tone-main)); color:#fff; font-weight:800; font-size:calc(var(--B) * 0.98); padding:5px 12px; text-align:center; position:relative; line-height:1.3; } /* v2.1 얇은 머리띠 (위아래 10px → 5px) */\n.card .chd.soft { background:var(--tt, var(--tone-main-tint)); color:var(--tc, var(--tone-main)); }\n.card .chd .hs { display:block; font-weight:500; font-size:calc(var(--B) * 0.74); opacity:.85; margin-top:1px; }\n.card .hsb { font-size:calc(var(--B) * 0.8); font-weight:600; color:var(--tc, var(--tone-main)); opacity:.85; line-height:1.3; }\n.card.has-head.center .hsb { text-align:center; }\n.card.tabbed { margin-top:calc(var(--B) * 0.45); overflow:visible; } .card.tabbed .chd { padding-left:calc(var(--B) * 1.75); text-align:left; border-radius:var(--board-radius) var(--board-radius) 0 0; }\n.card .numc { position:absolute; z-index:2; left:8px; top:calc(var(--B) * -0.42); width:calc(var(--B) * 1.3); height:calc(var(--B) * 1.3); border-radius:50%; background:var(--tone-main); color:#fff; border:2px solid #fff;\n  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:calc(var(--B) * 0.8); box-shadow:0 0 0 1.5px var(--tc, var(--tone-main)); }\n.card .num-in { display:inline-flex; align-items:center; justify-content:center; min-width:1.7em; height:1.7em; border-radius:50%; background:#fff; color:var(--tc, var(--tone-main));\n  font-weight:800; margin-right:8px; font-size:.82em; vertical-align:1px; padding:0 4px; }\n.card .ct { font-weight:800; font-size:calc(var(--B) * 1.04); color:var(--tc, var(--tone-main)); line-height:1.3; }\n.card .cs { font-size:calc(var(--B) * 0.86); color:var(--ink-soft); font-weight:500; line-height:1.35; }\n.card .cv { font-size:calc(var(--B) * 1.7); font-weight:800; color:var(--tc, var(--tone-main)); line-height:1.1; }\n.card .cv small { font-size:calc(var(--B) * 0.8); font-weight:700; margin-left:3px; }\n.card .kpi { display:flex; align-items:baseline; justify-content:center; gap:10px; flex-wrap:wrap; }\n.card .kpi .from { font-size:calc(var(--B) * 1.1); font-weight:700; color:var(--ink-soft); }\n.card .kpi .to { font-size:calc(var(--B) * 1.75); font-weight:800; color:var(--tc, var(--tone-main)); line-height:1.1; }\n.card .kpi .at { font-size:calc(var(--B) * 0.76); font-weight:600; color:var(--ink-soft); margin-left:2px; }\n.card .kpi .ar { color:var(--tc, var(--tone-main)); font-weight:800; font-size:calc(var(--B) * 1.1); }\n.card .kpi small { font-size:calc(var(--B) * 0.8); font-weight:700; margin-left:2px; }\n.card.f-solid .kpi .from, .card.f-solid .kpi .at, .card.focus .kpi .from, .card.focus .kpi .at { color:#fff; opacity:.8; }\n.card.f-solid .kpi .to, .card.f-solid .kpi .ar, .card.focus .kpi .to, .card.focus .kpi .ar { color:#fff; }\n.card .ic { width:calc(var(--B) * 2.6); height:calc(var(--B) * 2.6); border-radius:50%; background:var(--tt, var(--tone-main-tint)); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }\n.card .ic svg { width:58%; height:58%; stroke:var(--tc, var(--tone-main)); stroke-width:var(--board-icon-stroke); }\n.card.f-tint .ic, .card.f-panel .ic { background:#fff; }\n.card .trow { display:flex; align-items:center; gap:12px; }\n.card .trow .ic { width:calc(var(--B) * 2.1); height:calc(var(--B) * 2.1); }\n.card.f-solid .ic { background:rgba(255,255,255,.16); } .card.f-solid .ic svg { stroke:#fff; }\n.card .pillin { align-self:stretch; background:var(--board-chip); color:var(--ink); border-radius:var(--board-radius); font-weight:600; font-size:calc(var(--B) * 0.86); padding:6px 10px; text-align:center; }\n.card .pillin.toned { background:var(--pt-tint); color:var(--pt-ink); border:1.5px solid var(--pt-line); font-weight:700; } /* v2.1 pill_tone */\n.card.side { flex-direction:row; align-items:center; gap:14px; }\n.card.side > .txt { display:flex; flex-direction:column; gap:4px; min-width:0; flex:1; }\n\n/* ---- 목록 ---- */\nul.items { list-style:none; display:flex; flex-direction:column; gap:5px; font-size:calc(var(--B) * 0.9); color:var(--ink); }\nul.items li { position:relative; padding-left:0.85em; line-height:1.38; text-align:left; }\nul.items li::before { content:\"\"; position:absolute; left:2px; top:.62em; width:7px; height:7px; border-radius:50%; background:var(--tc, var(--tone-main)); }\nul.items.b-check li { padding-left:1.6em; } ul.items.b-check li::before { display:none; }\nul.items.b-check li .ck { position:absolute; left:0; top:.1em; width:1.25em; height:1.25em; }\nul.items.b-check li .ck svg { width:100%; height:100%; stroke:var(--tone-go); stroke-width:2.4; }\nul.items.b-dash li::before { width:9px; height:2px; border-radius:0; top:.72em; }\nul.items.b-num { counter-reset:n; } ul.items.b-num li { padding-left:1.75em; counter-increment:n; }\nul.items.b-num li::before { content:counter(n); width:1.35em; height: };\n  if (F.width) root.style.width = F.width + 'px';\n  // 글자 크기는 인쇄 pt로 정한다 — 그림을 print_cm 폭(기본 16cm, A4 세로 본문)으로 넣을 때\n  // 본문 글자(목록·설명)가 body_pt(기본 10pt)가 되도록. B 는 본문의 1/0.9 배(제목·머리 기준).\n  // v2.1 — 기본 9pt. 사용자 채택본 board형 9장이 16~17cm 삽입에서 본문 중앙 9.1pt(7.8~9.4)였다.\n  //        10pt는 채택본보다 한 단계 커서 좁은 칸에서 서너 줄씩 꺾였다(2026-11-12 \"논리 흐름도가 구려졌다\").\n  const PRINT_CM = F.print_cm || 16, BODY_PT = F.body_pt || 9;\n  const PX_PER_PT = (F.width || 1500) / (PRINT_CM / 2.54 * 72);\n  root.style.setProperty('--B', (BODY_PT / 0.9 * PX_PER_PT).toFixed(2) + 'px');\n  if (F.lane_r) root.style.paddingRight = (40 + F.lane_r) + 'px';\n  if (F.lane_l) root.style.paddingLeft = (40 + F.lane_l) + 'px';\n\n  function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }\n  function tone(e, t){ if(!t) return; const k=TONE[t]||t; e.style.setProperty('--tc','var(--tone-'+k+')'); e.style.setProperty('--tt','var(--tone-'+k+'-tint)'); e.style.setProperty('--tl','var(--tone-'+k+'-line)'); }\n  function icon(name, size){\n    const body = ICON_SET[name];\n    if(!body){ if(name) issues.push('아이콘 없음: '+name); return null; }\n    const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none');\n    s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round'); s.innerHTML=body;\n    if(size){ s.setAttribute('width',size); s.setAttribute('height',size); }\n    return s;\n  }\n  function reg(e, n){ if(n && n.id){ e.dataset.id=n.id; ids[n.id]=e; } if(n && n.w!=null){ e.style.flex = n.w==='auto' ? '0 0 auto' : (typeof n.w==='number' && n.w>20 ? '0 0 '+n.w+'px' : n.w+' 1 0'); } if(n && n.h){ e.style.minHeight=n.h+'px'; } if(n && n.focus) e.classList.add('focus'); if(n && n.indent){ e.style.marginLeft=n.indent+'px'; } if(n && n.indent_r){ e.style.marginRight=n.indent_r+'px'; } return e; }\n  function lines(v){ return Array.isArray(v) ? v : (v==null ? [] : [v])
