*Math.sin(2*Math.PI*(x-x0)/len), df=x=>amp*2*Math.PI/len*Math.cos(2*Math.PI*(x-x0)/len);\n    const top=[], bot=[]; for(let x=x0;x<=x1+0.01;x+=1.5){ const q=Math.min(x,x1), s=Math.hypot(1,df(q)); top.push([q,f(q)]); bot.push([q-df(q)*th/s,f(q)+th/s]); }\n    const dp=a=>a.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');\n    add(st,'path',{d:dp(top)+' '+dp(bot.slice().reverse()).replace(/^M/,'L')+' Z'},'fill:var(--bg,#fff);stroke:none');\n    add(st,'path',{d:dp(top)},'fill:none;stroke:var(--ink-soft);stroke-width:1.6;stroke-linejoin:round');\n    add(st,'path',{d:dp(bot)},'fill:none;stroke:var(--ink-soft);stroke-width:1.6;stroke-linejoin:round'); }\n  function dots(st,x1,y1,x2,y2,tn){ add(st,'path',{d:`M${x1} ${y1} L${x2} ${y2}`},'stroke:'+tc(tn||'mute','line')+';stroke-width:2.5;stroke-dasharray:2 7;stroke-linecap:round;fill:none'); }\n  function bulletParts(items,cls){ return [].concat(items||[]).map(x=>[x,(cls||'b')+' bul']); }\n\n  // ───────── funnel 깔때기 ─────────  stages[{label,value,note,drop,tone}]\n  function funnelX(d){\n    const s=d.stages, m=s.length, hh=92, gap=16, top=8, cx=400, W0=700, W1=250, noteX=cx+W0/2+84, noteW=W-noteX-6, st=stage(top+m*(hh+gap)-gap+10);\n    const wAt=k=>W0-(W0-W1)*(k/m), def=i=>i===m-1?'wait':(i===0?'go':(i>=m-2?'main':'sub'));\n    s.forEach((g,i)=>{ const y0=top+i*(hh+gap), y1=y0+hh, a=wAt(i)/2, b=wAt(i+1)/2, tn=g.tone||def(i), pts=`${cx-a},${y0} ${cx+a},${y0} ${cx+b},${y1} ${cx-b},${y1}`;\n      add(st,'rect',{x:0,y:y0,width:W,height:hh,rx:SOLID?8:0},'fill:'+tc(tn,'tint'));\n      add(st,'polygon',{points:pts},'fill:'+tc(tn)); if(GL>0) add(st,'polygon',{points:pts},'fill:'+grad(st,[[0,'#000',GL*0.5],[0.35,'#fff',GL*1.1],[0.7,'#fff',0],[1,'#000',GL*0.9]],{attrs:{x1:0,y1:0,x2:1,y2:0}}));\n      const L=lab(st,cx,(y0+y1)/2,2*b-24,[],{cls:'on',fit:[2*b,hh]}), row=div(); row.style.cssText='display:flex;gap:14px;align-items:baseline;justify-content:center;flex-wrap:wrap';\n      row.append(t('div','h2',g.l 과 아님\", \"body\": [{\"row\": [{\"spacer\": 1, \"w\": 200}, {\"steps\": [{\"title\": \"1단계 (6개월)\", \"sub\": \"기반 정비\"}, {\"title\": \"2단계 (1년)\", \"sub\": \"확대 적용\"}, {\"title\": \"3단계 (2년)\", \"sub\": \"상시 운영\"}], \"on\": 2}], \"gap\": 16}, {\"row\": [{\"pill\": \"5-1 지침\", \"shape\": \"square\", \"w\": 200}, {\"title\": \"검수 체크리스트 배포\", \"fill\": \"tint\"}, {\"title\": \"부서별 사용 범위 고시\", \"fill\": \"tint\"}, {\"title\": \"정례 점검 · 지침 개정\", \"focus\": true}], \"gap\": 16}, {\"row\": [{\"pill\": \"5-2 인력\", \"shape\": \"square\", \"w\": 200, \"tone\": \"sub\"}, {\"title\": \"부서별 담당자 지정\", \"tone\": \"sub\", \"fill\": \"tint\"}, {\"title\": \"검수 역량 교육 8시간\", \"tone\": \"sub\", \"fill\": \"tint\"}, {\"title\": \"전담 인력 상시 배치\", \"tone\": \"sub\", \"fill\": \"tint\"}], \"gap\": 16}, {\"row\": [{\"pill\": \"5-3 기록\", \"shape\": \"square\", \"w\": 200, \"tone\": \"go\"}, {\"title\": \"사용 이력 보관\", \"tone\": \"go\", \"fill\": \"tint\"}, {\"title\": \"오류 신고 창구\", \"tone\": \"go\", \"fill\": \"tint\"}, {\"title\": \"연 1회 성과 공개\", \"tone\": \"go\", \"fill\": \"tint\"}], \"gap\": 16}], \"page_footer\": \"더미 데이터 예시 — 실제 논문 아님\", \"page\": \"16:9\", \"width\": 1792, \"print_cm\": 26}", "i": ""}], "css": {"jf-timeless": "/* =========================================================================\n   doc-figure-multicolor 프리셋 — jf-timeless\n   컬러 컨셉: P-01 Timeless & reliable\n   컬러차트 P-01(#343752 · #90ACC7 · #FAD12B)을 그대로 쓴 컨셉. 원본 3색은 바꾸지 않고, 나머지 역할 색은 같은 색상의 명도·채도만 조절. 짙은 남색 바깥 배경, 노랑 표식, 색 면 위 글자는 대비에 따라 흰색·짙은 색 자동\n   @concept: deep\n\n   * 프리셋 규율: 토큰 '값'만 바꾸고 '이름'은 더하거나 빼지 않는다.\n   * @image-style: a modern presentation diagram in the P-01 Timeless & reliable palette: main #343752, secondary #90ACC7, outputs #496C8D, caution #FAD12B, risk #AA8B0E, borderless colored blocks, 14px rounded corners, bold title with a short color tag\n   ========================================================================= */\n:root {\n  /* v2.0.1 인쇄 크기 — 16cm 폭에 넣을 때 본문 약 10pt·최소 8pt 이상 (text-scale·caption-size·src-size·title-scale·word-break) */\n  /* --- 팔레트 --- */\n  --navy-deep:   #343752;   /* 뱃지·헤더밴드·푸터칩·누적박스 */\n  --navy-mid:    #90ACC7;   /* 보조 강조 */\n  --navy-marker: #FAD12B;   /* 게이트 ▼ · 마일스톤 ◆ */\n  --bar-fill:    #F1F1F4;   /* 간트바 채움 (연) */\n  --bar-fill-2:  #E2E3E9;   /* 간트바 채움 (진) */\n  --bar-border:  #90ACC7;   /* 간트바 테두리 */\n  --grid-line:   #DADBE2;   /* 월 구분 점선·격자 */\n  --ink:         #1E2033;   /* 본문 텍스트 */\n  --ink-soft:    #4A4E66;   /* 부제·캡션 */\n  --bg:          #FFFFFF;   /* 배경 (항상 흰색) */\n  --chip-track:  #E2E3E9;   /* 도넛 트랙 */\n\n  /* --- 확장 토큰 (추가만 — 기존 값 불변) --- */\n  --heat-1:      #EBF0F4;   /* 판정 히트맵 1단계(약) */\n  --heat-2:      #90ACC7;   /* 판정 히트맵 2단계(중) */\n  --heat-3:      #343752;   /* 판정 히트맵 3단계(강) */\n  --heat-1-ink:  #1E2033;\n  --heat-2-ink:  #1E2033;\n  --heat-3-ink:  #FFFFFF;\n  --neutral-fill:#F3F3F4;   /* 기준(무채색) 열·보조 바탕 */\n  --neutral-line:#C5C6CE;   /* 무채색 테두리 */\n  --neutral-ink: #50515E;   /* 무채색 본문 */\n  --accent:      #AA8B0E;   /* 강조색 — 병목·미통과 분기 */\n  --accent-soft: #FBF7E4;   /* 강조 배경 */\n  --track-1:     #343752;   /* 타임라인 축1 진남색 */\n  --track-2:     #717384;   /* 타임라인 축2 청회색 */\n  --track-3:     #AEAFB7;   /* 타임라인 축3 옅은 회색 */\n  /* --- 보조 선·바탕 (템플릿 하드코딩 제거분) --- */\n  --neutral-head:#595B69;\n  --line-soft:   #D5D6DC;\n  --fill-faint:  #F8F8F9;\n  --line-track:  #C8C9D0;\n\n\n  /* --- 타이포 --- */\n  --font: \"Presentation\", \"PresentationVariable\", \"Pretendard\", \"Apple SD Gothic Neo\", \"NanumSquare\", \"NanumGothic\", \"Malgun Gothic\", sans-serif;\n  --w-title: 800;\n  --w-strong: 700;\n  --w-label: 600;\n  --w-body: 500;\n\n  /* --- 형태 --- */\n  --radius-bar: 10px;\n  --radius-box: 14px;\n  --radius-badge: 30%;\n  --shadow: 0 0 0 transparent;\n\n  /* --- 형태 (v1.1 — 색이 아니라 '생김새'를 바꾸는 토큰) ---\n     기본값은 v1.0 모양과 같다. 값을 바꾸면 11종이 한꺼번에 다른 인상이 된다. */\n  --font-title:  \"Presentation\", \"PresentationVariable\", \"Pretendard\", \"Apple SD Gothic Neo\", \"NanumSquare\", \"NanumGothic\", \"Malgun Gothic\", sans-serif;   /* 제목 글꼴 — 본문(--font)과 따로 */\n  --title-align: left;       /* center | left */\n  --title-scale: 1.3;            /* 제목 크기 배율 */\n  --title-ink:   #1E2033;\n  --title-track: -1px;         /* 제목 자간 */\n  --title-deco:  none;        /* 제목 양옆 장식선: block | none */\n  --title-under: 0 solid transparent;   /* 제목 아래 가로줄 (border 값) */\n  --title-under-gap: 0px;\n  --caption-align: center;\n  --caption-ink: var(--ink);\n  --strong-fill: #343752;      /* 강조 상자(헤더 띠·뿌리 상자·최종 단계) 채움 */\n  --strong-ink:  #FFFFFF;\n  --strong-ink-soft: var(--bar-fill-2);\n  --strong-ring: inset 0 0 0 0 transparent;   /* 강조 상자 안쪽 테두리 — 외곽선형이면 inset 0 0 0 2px 색 */\n  --card-fill:   #FFFFFF;               /* 일반 카드 바탕 */\n  --badge-shape: 30%;                   /* 번호 뱃지·단계 원 — 50%=원, 4px=사각 */\n  --radius-pill: 14px;                 /* 알약형 칩 — 각지게 하려면 작은 값 */\n  --word-break: keep-all;                 /* keep-all = 한국어 낱말 단위 줄바꿈 */\n  --shadow-hub:  0 0 0 transparent;   /* 논증 도해 중심 상자 그림자 */\n\n  /* --- 편집 (v1.3 — 보고서·도판식 배치. 기본값은 v1.2 와 같다) --- */\n  --fig-display: flex;        /* flex 로 두면 캡션을 제목 위로 올릴 수 있다 */\n  --caption-order: 0;          /* -1 = 그림 번호·제목을 맨 위로 (국내 보고서 관례) */\n  --caption-mt: 1;             /* 캡션 위 여백 배율 (위로 올릴 땐 0) */\n  --caption-mb: 0px;\n  --caption-size: 30px;\n  --caption-weight: var(--w-label);\n  --src-size: 27px;            /* 자료·주 줄 */\n  --src-gap: 12px;\n  --title-tag: block;           /* block = 제목 위 짧은 색 막대 (도판식 표식) */\n  --title-tag-color: #FAD12B;\n  --accent-line: solid;       /* 강조(탈락·병목) 상자 테두리: dashed | solid */\n  --accent-fill: var(--accent-soft);   /* 강조 상자 바탕 — transparent 면 글자와 선만 */\n  --focus-fill:  #343752;     /* highlight 로 지정한 '제목이 말하는 그 요소' — 구조용 강조와 분리 */\n  --focus-ink:   #FFFFFF;\n  --focus-ink-soft: var(--strong-ink-soft);\n  --focus-ring:  var(--strong-ring);\n  --trim-x:      auto;         /* none = PNG 좌우 여백을 자르지 않는다 — 문서 속 그림 폭을 모두 같게 */\n  --text-scale:  2.0;            /* 도식 안 글자 배율 (제목은 --title-scale, 캡션·자료는 --caption-size·--src-size) */\n  --ornament:    none;         /* none = 뜻 없이 겹치는 장식(중복 번호 뱃지 등)을 걷는다 */\n\n  /* --- board (v2.0) — 뜻으로 고르는 색 6가지 + 조립 부품 --- */\n  --tone-main: #343752; --tone-main-tint: #EBEBF0; --tone-main-line: #EBEBF0;\n  --tone-sub: #90ACC7; --tone-sub-tint: #EBF0F4; --tone-sub-line: #EBF0F4;\n  --tone-go: #496C8D; --tone-go-tint: #EBF0F4; --tone-go-line: #EBF0F4;\n  --tone-wait: #FAD12B; --tone-wait-tint: #FDF8E3; --tone-wait-line: #FDF8E3;\n  --tone-stop: #AA8B0E; --tone-stop-tint: #FBF7E4; --tone-stop-line: #FBF7E4;\n  --tone-mute: #BFC1CF; --tone-mute-tint: #EEEEF2; --tone-mute-line: #EEEEF2;\n  --board-font: \"Presentation\", \"PresentationVariable\", \"Pretendard\", \"Apple SD Gothic Neo\", \"NanumSquare\", \"NanumGothic\", \"Malgun Gothic\", sans-serif;\n  --board-fs: 22px;                 /* 본문 기준 글자 — 그림 폭 1500px 의 1.5% (16cm 삽입 시 약 6.6pt) */\n  --board-line: #DCE1EA;\n  --board-panel: #F5F6F9;\n  --board-chip: #EBF0F4;\n  --board-radius: 14px;\n  --board-icon-stroke: 1.8;\n  --board-link-w: 3px;\n  --board-band-label: rgba(0, 0, 0, 0.18);\n  --board-bar-sep: rgba(255, 255, 255, 0.35);\n  --board-step-mid: #CFD0D8;\n  /* --- /board --- */\n\n  /* --- viz (v2.2) — 그라데이션·입체 스위치. 0 = 평면(기본). design-report 프리셋만 켠다 --- */\n  --gloss: 0;                       /* 0~0.35 — 도형 위 밝은 그라데이션의 세기 */\n  --solid: 0;                       /* 1 = 깔때기 타원 테·둥근 막대 끝 같은 입체 표현 */\n}\n", "jf-serene": "/* =========================================================================\n   doc-figure-multicolor 프리셋 — jf-serene\n   컬러 컨셉: P-02 Serene & warm\n   컬러차트 P-02(#A49393 · #EED6D3 · #E8B4B8)를 그대로 쓴 파스텔 컨셉. 원본 3색은 바꾸지 않고, 나머지 역할 색은 같은 색상의 명도·채도만 조절. 색 면 위 글자는 짙은 색, 화살표는 짙은 회갈색\n   @concept: soft\n\n   * 프리셋 규율: 토큰 '값'만 바꾸고 '이름'은 더하거나 빼지 않는다.\n   * @image-style: a modern presentation diagram in the P-02 Serene & warm palette: main #A49393, secondary #E8B4B8, outputs #C7AFAD, caution #EED6D3, risk #B98A90, borderless colored blocks, 18px rounded corners, bold title with a short  --track-2:     #965F7F;   /* 타임라인 축2 청회색 */\n  --track-3:     #B7AEB3;   /* 타임라인 축3 옅은 회색 */\n  /* --- 보조 선·바탕 (템플릿 하드코딩 제거분) --- */\n  --neutral-head:#695962;\n  --line-soft:   #E3CFDA;\n  --fill-faint:  #FBF7F9;\n  --line-track:  #D0C8CD;\n\n\n  /* --- 타이포 --- */\n  --font: \"Presentation\", \"PresentationVariable\", \"Pretendard\", \"Apple SD Gothic Neo\", \"NanumSquare\", \"NanumGothic\", \"Malgun Gothic\", sans-serif;\n  --w-title: 800;\n  --w-strong: 700;\n  --w-label: 600;\n  --w-body: 500;\n\n  /* --- 형태 --- */\n  --radius-bar: 2px;\n  --radius-box: 2px;\n  --radius-badge: 30%;\n  --shadow: 0 0 0 transparent;\n\n  /* --- 형태 (v1.1 — 색이 아니라 '생김새'를 바꾸는 토큰) ---\n     기본값은 v1.0 모양과 같다. 값을 바꾸면 11종이 한꺼번에 다른 인상이 된다. */\n  --font-title:  \"Presentation\", \"PresentationVariable\", \"Pretendard\", \"Apple SD Gothic Neo\", \"NanumSquare\", \"NanumGothic\", \"Malgun Gothic\", sans-serif;   /* 제목 글꼴 — 본문(--font)과 따로 */\n  --title-align: left;       /* center | left */\n  --title-scale: 1.3;            /* 제목 크기 배율 */\n  --title-ink:   var(--navy-deep);\n  --title-track: -1px;         /* 제목 자간 */\n  --title-deco:  none;        /* 제목 양옆 장식선: block | none */\n  --title-under: 0 solid transparent;   /* 제목 아래 가로줄 (border 값) */\n  --title-under-gap: 0px;\n  --caption-align: center;\n  --caption-ink: var(--ink);\n  --strong-fill: var(--navy-deep);      /* 강조 상자(헤더 띠·뿌리 상자·최종 단계) 채움 */\n  --strong-ink:  #FFFFFF;\n  --strong-ink-soft: var(--bar-fill-2);\n  --strong-ring: inset 0 0 0 0 transparent;   /* 강조 상자 안쪽 테두리 — 외곽선형이면 inset 0 0 0 2px 색 */\n  --card-fill:   #FFFFFF;               /* 일반 카드 바탕 */\n  --badge-shape: 30%;                   /* 번호 뱃지·단계 원 — 50%=원, 4px=사각 */\n  --radius-pill: 4px;                 /* 알약형 칩 — 각지게 하려면 작은 값 */\n  --word-break: keep-all;                 /* keep-all = 한국어 낱말 단위 줄바꿈 */\n  --shadow-hub:  0 0 0 transparent;   /* 논증 도해 중심 상자 그림자 */\n\n  /* --- 편집 (v1.3 — 보고서·도판식 배치. 기본값은 v1.2 와 같다) --- */\n  --fig-display: flex;        /* flex 로 두면 캡션을 제목 위로 -board-bar-sep: rgba(255, 255, 255, 0.35);\n  --board-step-mid: #E0C7D6;\n  /* --- /board --- */\n\n  /* --- viz (v2.2) — 그라데이션·입체 스위치. 0 = 평면(기본). design-report 프리셋만 켠다 --- */\n  --gloss: 0;                       /* 0~0.35 — 도형 위 밝은 그라데이션의 세기 */\n  --solid: 0;                       /* 1 = 깔때기 타원 테·둥근 막대 끝 같은 입체 표현 */\n}\n", "jf-risk": "/* =========================================================================\n   doc-figure-multicolor 프리셋 — jf-risk\n   내용 계열: 보건·안전·위험 (risk)\n   색은 뜻으로: main 핵심 개념, sub 하위 개념, go 결과·산출, wait 조건·주의, stop 문제·위험, mute 기존·선행연구\n   공통 생김새: 제목 왼쪽 + 짧은 색 표식, 둥근 사각 번호(30%), 각진 칩\n\n   * 프리셋 규율: 토큰 '값'만 바꾸고 '이름'은 더하거나 빼지 않는다.\n   * @image-style: a clean Korean academic presentation diagram, risk family: main #A51E45, secondary #C9506F, outputs #2A7468, caution #9C6A10, risk #6E1F5E, pale tinted cards, 8px corners, short color tag above a left-aligned title, no shadows, Freesentation-like Korean presentation sans-serif\n   ========================================================================= */\n:root {\n  /* v2.0.1 인쇄 크기 — 16cm 폭에 넣을 때 본문 약 10pt·최소 8pt 이상 (text-scale·caption-size·src-size·title-scale·word-break) */\n  /* --- 팔레트 --- */\n  --navy-deep:   #A51E45;   /* 뱃지·헤더밴드·푸터칩·누적박스 */\n  --navy-mid:    #C74869;   /* 보조 강조 */\n  --navy-marker: #9C6A10;   /* 게이트 ▼ · 마일스톤 ◆ */\n  --bar-fill:    #F8EDF0;   /* 간트바 채움 (연) */\n  --bar-fill-2:  #EFDCE1;   /* 간트바 채움 (진) */\n  --bar-border:  #C74869;   /* 간트바 테두리 */\n  --grid-line:   #E2DADC;   /* 월 구분 점선·격자 */\n  --ink:         #2F1E23;   /* 본문 텍스트 */\n  --ink-soft:    #705C62;   /* 부제·캡션 */\n  --bg:          #FFFFFF;   /* 배경 (항상 흰색) */\n  --chip-track:  #EFDCE1;   /* 도넛 트랙 */\n\n  /* --- 확장 토큰 (추가만 — 기존 값 불변) --- */\n  --heat-1:      #F5EAED;   /* 판정 히트맵 1단계(약) */\n  --heat-2:      #CEA1AE;   /* 판정 히트맵 2단계(중) */\n  --heat-3:      #5F1128;   /* 판정 히트맵 3단계(강) */\n  --heat-1-ink:  #2F1E23;\n  --heat-2-ink:  #201317;\n  --heat-3-ink:  #FFFFFF;\n  --neutral-fill:#F4F3F3;   /* 기준(무채색) 열·보조 바탕 */\n     var selP = document.getElementById('sw-preset'), selF = document.getElementById('sw-font');
    selP.value = curP; selF.value = curF;
    selP.addEventListener('change', function(){ theme(selP.value, curF); });
    selF.addEventListener('change', function(){ theme(curP, selF.value); });
    document.documentElement.style.setProperty('--backdrop', SW.backdrop[curP]);
    document.body.classList.toggle('dark', !!SW.dark[curP]);
    nav.classList.add('has-sw');
  }
  window.addEventListener('beforeprint', function(){ stage.style.transform = ''; });
  window.addEventListener('afterprint', fit);
  fit();
  if (animBox) { animBox.checked = animOn; animBox.addEventListener('change', function(){ setAnim(animBox.checked); }); }
  var h = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(h) ? 0 : h - 1, false);
})();
</script>
</body>
